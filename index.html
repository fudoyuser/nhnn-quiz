vbhn118:{
  sum:"Thông tư thiết kế quy trình tiêu hủy tiền theo nguyên tắc kiểm soát chéo chặt chẽ. Lần sửa đổi 2026 chủ yếu cập nhật tên đơn vị, chuyển chức năng giám sát sang Thanh tra NHNN và điều chỉnh một số bước kiểm đếm, báo cáo. Phần còn bỏ ngỏ nằm ở cân bằng quyền lực trong Hội đồng tiêu hủy, các tiêu chí kỹ thuật và việc ứng dụng công nghệ.",
  items:[
  {t:"plus",title:"Phân tách nhiệm vụ và kiểm soát chéo nhiều lớp",cite:"Điều 10; Điều 13 khoản 2; Điều 16 khoản 7, 8",body:"Bốn tổ chuyên trách độc lập (giao nhận, kiểm đếm, cắt hủy, tổng hợp). Kho tiền ba thành viên, mỗi người giữ một ổ khóa. Mọi lần giao nhận đều lập biên bản, cửa phòng niêm phong có chữ ký của tổ trưởng và công chức giám sát. Không một cá nhân nào kiểm soát trọn vẹn một luồng tiền, giảm đáng kể rủi ro thông đồng."},
  {t:"plus",title:"Kiểm đếm theo tỷ lệ dựa trên dữ liệu rủi ro",cite:"Điều 4 khoản 2; Điều 15 khoản 3",body:"Thay vì kiểm đếm toàn bộ, tỷ lệ kiểm đếm từng loại tiền được quyết định căn cứ kết quả thừa, thiếu của năm, và mẫu được lấy ngẫu nhiên. Cách tiếp cận này tiết kiệm nguồn lực và tập trung vào nơi có rủi ro."},
  {t:"plus",title:"Giám sát độc lập hơn",cite:"Điều 29; khoản 3 Điều 13 TT 42/2026",body:"Chức năng chủ trì giám sát chuyển từ Vụ Kiểm toán nội bộ sang Thanh tra NHNN, cùng với Hội đồng giám sát tách biệt khỏi Hội đồng tiêu hủy. Bên thực hiện và bên giám sát được tách rõ."},
  {t:"issue",title:"Quyền lực tập trung ở một đơn vị",cite:"Điều 3 khoản 1; Điều 4 khoản 2; Điều 6 khoản 1 điểm a; Điều 8; Điều 28 khoản 1",body:"Cục Phát hành và Kho quỹ xây dựng định mức và kế hoạch tiêu hủy. Cục trưởng vừa trình kế hoạch, vừa làm Chủ tịch Hội đồng tiêu hủy, vừa ban hành nội quy, vừa tự quyết định tỷ lệ kiểm đếm, tức mức độ kiểm tra đối với chính hoạt động do mình tổ chức.",rec:"Yêu cầu Hội đồng giám sát có ý kiến trước khi Chủ tịch quyết định tỷ lệ kiểm đếm, hoặc báo cáo Thống đốc tỷ lệ áp dụng kèm căn cứ."},
  {t:"gap",title:"Không có sàn tối thiểu cho tỷ lệ kiểm đếm",cite:"Điều 4 khoản 2; Điều 8 khoản 3",body:"Thông tư không quy định tỷ lệ kiểm đếm tối thiểu hay phương pháp xác định tỷ lệ từ kết quả thừa, thiếu. Về lý thuyết, tỷ lệ có thể được đặt rất thấp nếu năm trước ít sai lệch. Khi đó khả năng phát hiện sai sót giảm, trong khi tiền đã cắt hủy thì không thể kiểm tra lại.",rec:"Quy định tỷ lệ sàn cho từng loại tiền và công thức tham chiếu, ví dụ tăng tỷ lệ khi tỷ lệ thừa, thiếu vượt ngưỡng."},
  {t:"gap",title:"Dùng chính tiền tiêu hủy làm quỹ tạm ứng bù thiếu",cite:"Điều 16 khoản 6",body:"Tổ 2 được tạm ứng tiền tiêu hủy để bù vào bó thiếu tờ, lẫn loại, tiền giả. Thông tư không quy định hạn mức tạm ứng tối đa và không quy định thời điểm đối chiếu ngoài kiểm kê hằng ngày. Số tạm ứng còn lại chỉ bị tiêu hủy vào cuối đợt, nên có một lượng tiền thật tồn tại ngoài quy trình chính trong thời gian dài.",rec:"Đặt hạn mức tạm ứng theo mệnh giá và yêu cầu đối chiếu số dư tạm ứng trong biên bản cuối ngày."},
  {t:"gap",title:"Thiếu tiêu chuẩn kỹ thuật cho phế liệu và yêu cầu môi trường",cite:"Điều 4 khoản 4; Điều 5; Điều 28 khoản 6",body:"Văn bản chỉ yêu cầu phế liệu “không thể khôi phục để sử dụng lại như tiền”, không quy định kích thước mảnh cắt hay phương pháp kiểm tra. Phế liệu được bán theo phương án do Cục trình. Tiền polymer và kim loại có đặc điểm xử lý môi trường riêng nhưng không được đề cập.",rec:"Ban hành tiêu chí kỹ thuật phế liệu (kích thước tối đa, kiểm tra mẫu) và yêu cầu xử lý, tái chế phù hợp quy định bảo vệ môi trường."},
  {t:"gap",title:"Nhiều nội dung kỹ thuật giao văn bản hướng dẫn nội bộ",cite:"Điều 17 khoản 5; Điều 18 khoản 4; Điều 21 khoản 2; Điều 28 khoản 4",body:"Quy trình máy hủy, yêu cầu trang thiết bị, phương pháp kiểm kê, sổ sách và báo cáo đều do Cục trưởng hướng dẫn hoặc “theo quy định hiện hành”. Điều này hợp lý về mặt bảo mật (Điều 4 khoản 1), nhưng khiến Thông tư khó được đánh giá độc lập và phụ thuộc vào chất lượng văn bản hướng dẫn."},
  {t:"issue",title:"Quy trình chủ yếu thủ công, chưa tính đến công nghệ giám sát",cite:"Điều 16; Điều 18; Điều 23",body:"Toàn bộ quy trình dựa vào sổ sách, biên bản giấy và niêm phong có chữ ký. Điều 18 cấm cá nhân mang thiết bị ghi hình nhưng không quy định hệ thống camera giám sát của đơn vị, máy đếm và phân loại tự động hay sổ kế toán điện tử, là các công cụ có thể tăng mạnh khả năng truy vết.",rec:"Bổ sung yêu cầu camera giám sát liên tục khu vực kiểm đếm, cắt hủy, lưu trữ có thời hạn, và lộ trình số hóa sổ sách."},
  {t:"gap",title:"Không có giới hạn thời gian lưu kho trước khi hủy",cite:"Điều 15; Điều 20 khoản 1",body:"Thông tư không quy định thời gian tối đa từ khi nhận tiền từ Kho tiền Trung ương đến khi cắt hủy. Với tiền lẫn loại, tiền giả, Phó Chủ tịch phụ trách cụm tự quyết định “thời điểm tiêu hủy trong năm”. Tiền chờ hủy càng lâu thì rủi ro bảo quản càng cao.",rec:"Quy định thời hạn lưu kho tối đa hoặc yêu cầu báo cáo Hội đồng giám sát số tồn chờ hủy theo tuổi kho."},
  {t:"gap",title:"Văn bản hợp nhất không cho thấy nội dung đã bị bãi bỏ",cite:"Điều 16 khoản 8 điểm đ",body:"Điểm đ chỉ ghi “(được bãi bỏ)” mà không nêu nội dung cũ. Người học và người thực thi phải tra lại văn bản gốc mới hiểu được thay đổi."}

  {q:"Hướng hoàn thiện nào được đề xuất để cân bằng thẩm quyền quyết định tỷ lệ kiểm đếm?",o:["Hội đồng giám sát có ý kiến trước khi quyết định, hoặc báo cáo Thống đốc tỷ lệ áp dụng kèm căn cứ","Bỏ hẳn việc kiểm đếm trước khi tiêu hủy","Giao Thủ kho quyết định tỷ lệ","Kiểm đếm 100% mọi bó tiền"],c:"Điều 4 khoản 2; Điều 8 khoản 3",ex:"Đề xuất: Hội đồng giám sát có ý kiến trước khi Chủ tịch quyết định tỷ lệ kiểm đếm, hoặc báo cáo Thống đốc tỷ lệ áp dụng kèm căn cứ."},
  {q:"Rủi ro nào phát sinh khi Thông tư không quy định tỷ lệ kiểm đếm tối thiểu?",o:["Tỷ lệ có thể bị đặt rất thấp, làm giảm khả năng phát hiện sai sót, trong khi tiền đã cắt hủy không thể kiểm tra lại","Phải kiểm đếm lại toàn bộ tiền đã hủy","Hội đồng tiêu hủy không được thành lập","Tiền giả được đưa trở lại lưu thông"],c:"Điều 4 khoản 2; Điều 8 khoản 3",ex:"Đề xuất: quy định tỷ lệ sàn cho từng loại tiền và công thức tham chiếu, ví dụ tăng tỷ lệ khi tỷ lệ thừa, thiếu vượt ngưỡng."},
  {q:"Vấn đề nào được chỉ ra đối với quỹ tạm ứng bù thiếu của Tổ 2?",o:["Không có hạn mức tạm ứng tối đa, số dư chỉ bị hủy cuối đợt nên tiền thật tồn ngoài quy trình chính trong thời gian dài","Quỹ tạm ứng lấy từ ngân sách nhà nước","Quỹ tạm ứng không được kiểm kê","Quỹ tạm ứng do tổ chức tín dụng nộp"],c:"Điều 16 khoản 6",ex:"Đề xuất: đặt hạn mức tạm ứng theo mệnh giá và yêu cầu đối chiếu số dư tạm ứng trong biên bản cuối ngày."},
  {q:"Khoảng trống nào được chỉ ra về phế liệu tiền sau tiêu hủy?",o:["Không quy định kích thước mảnh cắt, phương pháp kiểm tra, và không đề cập xử lý môi trường với tiền polymer, kim loại","Cấm bán phế liệu dưới mọi hình thức","Phế liệu phải được lưu kho vĩnh viễn","Phế liệu được trả lại tổ chức tín dụng"],c:"Điều 4 khoản 4; Điều 5; Điều 28 khoản 6",ex:"Văn bản chỉ yêu cầu phế liệu “không thể khôi phục để sử dụng lại như tiền”. Đề xuất: tiêu chí kỹ thuật phế liệu và yêu cầu xử lý, tái chế phù hợp quy định bảo vệ môi trường."},
  {q:"Theo phân tích, công cụ nào chưa được Thông tư đề cập dù có thể tăng khả năng truy vết?",o:["Camera giám sát của đơn vị, máy đếm và phân loại tự động, sổ kế toán điện tử","Niêm phong có chữ ký","Biên bản giao nhận","Thẻ nhân viên và trang phục"],c:"Điều 16; Điều 18; Điều 23",ex:"Toàn bộ quy trình dựa vào sổ sách, biên bản giấy và niêm phong. Điều 18 cấm cá nhân mang thiết bị ghi hình nhưng không quy định camera của đơn vị."},
  {q:"Vấn đề nào được nêu về thời gian lưu kho tiền trước khi tiêu hủy?",o:["Không có thời hạn tối đa từ khi nhận đến khi cắt hủy; tiền lẫn loại, tiền giả do Phó Chủ tịch tự chọn “thời điểm tiêu hủy trong năm”","Tiền phải hủy ngay trong ngày nhận","Thời hạn lưu kho tối đa là 15 ngày làm việc","Tiền chỉ được hủy vào tháng 12"],c:"Điều 15; Điều 20 khoản 1",ex:"Tiền chờ hủy càng lâu thì rủi ro bảo quản càng cao. Đề xuất: quy định thời hạn lưu kho tối đa hoặc báo cáo Hội đồng giám sát số tồn chờ hủy theo tuổi kho."},
  {q:"Biểu hiện nào thể hiện nguyên tắc kiểm soát chéo nhiều lớp được đánh giá là điểm hợp lý?",o:["Bốn tổ chuyên trách độc lập; kho ba thành viên mỗi người giữ một ổ khóa; cửa phòng niêm phong có chữ ký tổ trưởng và công chức giám sát","Một cá nhân chịu trách nhiệm toàn bộ luồng tiền để dễ quy trách nhiệm","Hội đồng tiêu hủy tự giám sát chính mình","Chỉ thủ kho được ra vào khu vực cắt hủy"],c:"Điều 10; Điều 13 khoản 2; Điều 16 khoản 7, 8",ex:"Không một cá nhân nào kiểm soát trọn vẹn một luồng tiền, giảm đáng kể rủi ro thông đồng."},
  {q:"Vì sao cơ chế kiểm đếm theo tỷ lệ được đánh giá là hợp lý?",o:["Tiết kiệm nguồn lực, tập trung vào nơi có rủi ro, dựa trên dữ liệu thừa thiếu và mẫu được lấy ngẫu nhiên","Vì không cần kiểm đếm bất kỳ bó tiền nào","Vì tỷ lệ do Thống đốc cố định cho mọi năm","Vì tổ chức tín dụng tự kiểm đếm trước"],c:"Điều 4 khoản 2; Điều 15 khoản 3",ex:"Thay vì kiểm đếm toàn bộ, tỷ lệ được quyết định theo kết quả thừa, thiếu của năm và mẫu được lấy ngẫu nhiên."},
  {q:"Việc chuyển chức năng chủ trì giám sát tiêu hủy tiền sang Thanh tra NHNN được đánh giá thế nào?",o:["Tách rõ bên thực hiện và bên giám sát, tăng tính độc lập","Làm giảm tính độc lập vì Thanh tra trực thuộc Cục Phát hành và Kho quỹ","Không có thay đổi gì so với trước","Khiến Hội đồng giám sát bị giải thể"],c:"Điều 29; khoản 3 Điều 13 TT 42/2026",ex:"Chức năng chủ trì giám sát chuyển từ Vụ Kiểm toán nội bộ sang Thanh tra NHNN, cùng với Hội đồng giám sát tách biệt khỏi Hội đồng tiêu hủy."},
  {q:"Việc nhiều nội dung kỹ thuật được giao cho văn bản hướng dẫn nội bộ có hệ quả gì?",o:["Hợp lý về bảo mật, nhưng khiến Thông tư khó được đánh giá độc lập và phụ thuộc vào chất lượng văn bản hướng dẫn","Khiến Thông tư không có hiệu lực","Buộc phải công bố quy trình máy hủy lên Công báo","Làm Hội đồng giám sát mất thẩm quyền"],c:"Điều 17 khoản 5; Điều 18 khoản 4; Điều 21 khoản 2; Điều 28 khoản 4",ex:"Quy trình máy hủy, trang thiết bị, phương pháp kiểm kê, sổ sách đều do Cục trưởng hướng dẫn hoặc “theo quy định hiện hành”."},
  {q:"Bất tiện nào được chỉ ra ở cách văn bản hợp nhất thể hiện Điều 16 khoản 8 điểm đ?",o:["Chỉ ghi “(được bãi bỏ)” mà không nêu nội dung cũ, người đọc phải tra văn bản gốc","Điểm đ bị lặp lại hai lần","Điểm đ mâu thuẫn với Điều 1","Điểm đ chưa có hiệu lực"],c:"Điều 16 khoản 8 điểm đ",ex:"Người học và người thực thi phải tra lại văn bản gốc mới hiểu được thay đổi."}
]
};

/* ---------- trạng thái ---------- */
const $ = s => document.querySelector(s);
const store = {
  get(k,d){try{const v=localStorage.getItem("qnhnn:"+k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem("qnhnn:"+k,JSON.stringify(v))}catch(e){}}
};
let doc = DOCS[0];
let filter = "all";
let view = "quiz";
let kindOff = {};
let S = null; // phiên làm bài
let tick = null;

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
const L="ABCD";

function renderStats(){
  const h = store.get("hist_"+doc.id,[]);
  const best = h.filter(x=>x.mode==="exam").reduce((m,x)=>Math.max(m,Math.round(x.ok/x.n*100)),0);
  const wrong = store.get("wrong_"+doc.id,[]).length;
  $("#stats").innerHTML = `<div><b>${doc.qs.length}</b>câu hỏi</div><div><b>${h.length}</b>lượt làm</div><div><b>${best?best+"%":"–"}</b>điểm thi cao nhất</div><div><b>${wrong}</b>câu cần ôn</div>`;
}
function renderDocs(){
  $("#docs").innerHTML = DOCS.map(d=>`<button class="doc ${d.id===doc.id?"on":""}" type="button" data-id="${d.id}">
    <div class="no">${d.no}</div><div class="tt">${esc(d.title)}</div>
    <div class="meta"><span>Xác thực ngày ${d.date}</span><span>${esc(d.signer)}</span></div></button>
    <div class="chain" style="margin:10px 0 14px">${d.chain.map(c=>`<div><b>${c[0]}</b><br>${c[1]}</div>`).join("")}</div>`).join("");
}

/* ---------- màn hình chọn ---------- */
function home(){
  clearInterval(tick); S=null;
  const cr = CRIT[doc.id];
  const tabs = `<div class="tabs" role="tablist">
    <button type="button" class="tab ${view==="quiz"?"on":""}" data-v="quiz" role="tab">Trắc nghiệm<i>${doc.qs.length}</i></button>
    ${cr?`<button type="button" class="tab ${view==="crit"?"on":""}" data-v="crit" role="tab">Phản biện<i>${cr.items.length}</i></button>`:""}</div>`;
  if(view==="crit" && cr){ critique(tabs, cr); return; }
  const counts = {}; doc.qs.forEach(q=>counts[q.ch]=(counts[q.ch]||0)+1);
  const amCount = doc.qs.filter(q=>q.am).length;
  const wrong = store.get("wrong_"+doc.id,[]);
  const chips = [["all","Tất cả",doc.qs.length],["am",doc.amChip,amCount],...Object.keys(doc.chapters).map(k=>[k,doc.chapters[k].split(" · ")[0],counts[k]||0])];
  $("#desk").innerHTML = `
    ${tabs}
    <h2>${esc(doc.title)}</h2>
    <p class="lead">${doc.no} · ${doc.qs.length} câu hỏi trắc nghiệm, mỗi câu có trích dẫn điều, khoản. Câu có nhãn vàng là ${doc.amLead}.</p>
    <label class="fl">Phạm vi câu hỏi</label>
    <div class="chips" id="chips">${chips.map(c=>`<button type="button" class="chip ${filter===c[0]?"on":""}" data-f="${c[0]}">${c[1]}<i>${c[2]}</i></button>`).join("")}</div>
    <label class="fl">Chế độ</label>
    <div class="modes">
      <button type="button" class="mode" data-m="practice"><span class="k">Luyện tập</span><b>Xem đáp án ngay</b><span>Làm lần lượt theo phạm vi đã chọn. Đọc căn cứ sau mỗi câu.</span></button>
      <button type="button" class="mode" data-m="exam"><span class="k">Thi thử</span><b>20 câu · 15 phút</b><span>Chọn ngẫu nhiên từ câu hỏi về nội dung văn bản, chấm điểm khi nộp bài. Đạt từ 80%.</span></button>
      <button type="button" class="mode" data-m="wrong" ${wrong.length?"":"disabled"}><span class="k">Ôn câu sai</span><b>${wrong.length} câu</b><span>${wrong.length?"Những câu bạn trả lời sai gần đây.":"Chưa có câu sai nào được lưu."}</span></button>
    </div>
    <h3 class="sec">Cấu trúc văn bản</h3>
    <div class="toc">${Object.keys(doc.chapters).map(k=>{const [a,b]=doc.chapters[k].split(" · ");return `<div><span class="c">${a}</span><span>${b}</span><span class="n">${counts[k]||0} câu</span></div>`}).join("")}</div>
    <p class="note">Nguồn: Văn bản hợp nhất ${doc.no}, đăng trên Cổng Thông tin điện tử Chính phủ. Văn bản hợp nhất dùng để tra cứu; khi áp dụng, ${doc.src}.</p>`;
  bindTabs();
  $("#chips").onclick = e=>{const b=e.target.closest(".chip");if(!b)return;filter=b.dataset.f;home()};
  $("#desk").querySelectorAll(".mode").forEach(b=>b.onclick=()=>start(b.dataset.m));
}

function bindTabs(){ $("#desk").querySelectorAll(".tab").forEach(b=>b.onclick=()=>{view=b.dataset.v;home()}); }
function critique(tabs, cr){
  const cnt={}; cr.items.forEach(x=>cnt[x.t]=(cnt[x.t]||0)+1);
  const shown = cr.items.filter(x=>!kindOff[x.t]);
  const pbN = doc.qs.filter(q=>q.ch==="PB").length;
  $("#desk").innerHTML = `
    ${tabs}
    <h2>Phản biện: ${esc(doc.title)}</h2>
    <p class="lead">${doc.no} · Phân tích điểm hợp lý, điểm cần làm rõ và bất cập, kèm căn cứ điều khoản và hướng hoàn thiện.</p>
    <p class="crit-sum">${esc(cr.sum)}</p>
    ${pbN?`<div class="nav" style="margin:0 0 20px;justify-content:flex-start"><button type="button" class="btn" id="pbgo">Làm quiz phản biện · ${pbN} câu</button></div>`:""}
    <div class="legend">${Object.keys(KIND).map(k=>`<button type="button" class="pill ${KIND[k][1]} ${kindOff[k]?"off":""}" data-k="${k}" aria-pressed="${!kindOff[k]}">${KIND[k][0]} · ${cnt[k]||0}</button>`).join("")}</div>
    <div class="crits">${shown.map(x=>`<article class="crit">
      <span class="kind ${KIND[x.t][1]}">${KIND[x.t][0]}</span>
      <div class="ch"><b>${esc(x.title)}</b><span>${esc(x.cite)}</span></div>
      <p>${esc(x.body)}</p>
      ${x.rec?`<div class="rec"><b>Hướng hoàn thiện</b>${esc(x.rec)}</div>`:""}
    </article>`).join("") || `<p class="lead">Bật lại ít nhất một nhóm ở trên để xem nội dung.</p>`}</div>
    <h3 class="sec" style="margin-top:26px">Câu hỏi thảo luận</h3>
    <ol class="disc">${cr.discuss.map(d=>`<li>${esc(d)}</li>`).join("")}</ol>
    <p class="note">Phần phản biện là phân tích mang tính học thuật, soạn dựa trên nội dung văn bản hợp nhất để phục vụ ôn tập và thảo luận. Đây không phải quan điểm chính thức của Ngân hàng Nhà nước hay cơ quan ban hành.</p>`;
  bindTabs();
  if($("#pbgo")) $("#pbgo").onclick=()=>{view="quiz";filter="PB";start("practice")};
  $("#desk").querySelectorAll(".pill").forEach(b=>b.onclick=()=>{kindOff[b.dataset.k]=!kindOff[b.dataset.k];home()});
}

function pool(){
  if(filter==="all") return doc.qs.map((q,i)=>i);
  if(filter==="am") return doc.qs.map((q,i)=>q.am?i:-1).filter(i=>i>=0);
  return doc.qs.map((q,i)=>q.ch===filter?i:-1).filter(i=>i>=0);
}
function start(mode){
  let ids;
  if(mode==="wrong") ids = shuffle(store.get("wrong_"+doc.id,[]).filter(i=>doc.qs[i]));
  else if(mode==="exam") ids = shuffle(doc.qs.map((q,i)=>q.ch==="PB"?-1:i).filter(i=>i>=0)).slice(0,20);
  else ids = pool();
  if(!ids.length) return;
  S = {mode, ids, i:0, ans:{}, order:{}, t0:Date.now(), limit: mode==="exam"?15*60:0, done:false};
  ids.forEach(id=>S.order[id]=shuffle([0,1,2,3]));
  clearInterval(tick);
  if(S.limit){tick=setInterval(()=>{const el=$("#timer");if(!el||!S)return;const left=S.limit-Math.floor((Date.now()-S.t0)/1000);if(left<=0){finish();return}el.textContent=fmt(left);el.classList.toggle("low",left<120)},1000)}
  question();
}
const fmt = s=>String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");

function question(){
  const id=S.ids[S.i], q=doc.qs[id], picked=S.ans[id], ord=S.order[id];
  const reveal = S.mode!=="exam" && picked!==undefined;
  const label = {practice:"Luyện tập",exam:"Thi thử",wrong:"Ôn câu sai"}[S.mode];
  const answered = Object.keys(S.ans).length;
  $("#desk").innerHTML = `
    <div class="bar"><span>${label} · Câu ${S.i+1}/${S.ids.length}</span>
      <span>${S.limit?`Còn lại <span class="timer" id="timer">${fmt(Math.max(0,S.limit-Math.floor((Date.now()-S.t0)/1000)))}</span> · `:""}Đã trả lời ${answered}</span></div>
    <div class="prog"><i style="width:${(S.i+1)/S.ids.length*100}%"></i></div>
    <div class="qtag"><span class="tag">${doc.chapters[q.ch].split(" · ")[0]}</span>${q.am?`<span class="tag am">${typeof q.am==="string"?q.am:doc.amTag}</span>`:""}</div>
    <p class="q">${esc(q.q)}</p>
    <div class="opts">${ord.map((oi,k)=>{
      let cls=""; if(reveal){ if(oi===0) cls="ok"; else if(oi===picked) cls="bad"; } else if(picked===oi) cls="pick";
      return `<button type="button" class="opt ${cls}" data-o="${oi}" ${reveal?"disabled":""}><span class="l">${L[k]}</span><span>${esc(q.o[oi])}</span></button>`}).join("")}</div>
    ${reveal?`<div class="basis"><div class="hd ${picked===0?"ok":"bad"}">${picked===0?"Chính xác":"Chưa đúng · Đáp án "+L[ord.indexOf(0)]}<span>${esc(q.c)}</span></div><blockquote>${esc(q.ex)}</blockquote></div>`:""}
    <div class="nav">
      <button type="button" class="btn quiet" id="quit">Thoát</button>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button type="button" class="btn ghost" id="prev" ${S.i===0?"disabled":""}>Câu trước</button>
        ${S.i<S.ids.length-1?`<button type="button" class="btn" id="next">Câu tiếp</button>`:`<button type="button" class="btn" id="end">${S.mode==="exam"?"Nộp bài":"Xem kết quả"}</button>`}
      </div>
    </div>`;
  $("#desk").querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    if(S.mode!=="exam" && S.ans[id]!==undefined) return;
    S.ans[id]=+b.dataset.o; question();
  });
  $("#quit").onclick=home;
  $("#prev").onclick=()=>{S.i--;question()};
  if($("#next")) $("#next").onclick=()=>{S.i++;question()};
  if($("#end")) $("#end").onclick=finish;
}

function finish(){
  if(!S||S.done) return; S.done=true; clearInterval(tick);
  const n=S.ids.length, okIds=S.ids.filter(id=>S.ans[id]===0), ok=okIds.length;
  const pct=Math.round(ok/n*100), secs=Math.floor((Date.now()-S.t0)/1000);
  // cập nhật danh sách câu sai
  let wrong=new Set(store.get("wrong_"+doc.id,[]));
  S.ids.forEach(id=>{ if(S.ans[id]===0) wrong.delete(id); else if(S.ans[id]!==undefined) wrong.add(id); });
  store.set("wrong_"+doc.id,[...wrong]);
  const h=store.get("hist_"+doc.id,[]); h.push({mode:S.mode,n,ok,at:Date.now()}); store.set("hist_"+doc.id,h.slice(-50));
  renderStats();
  const by={}; S.ids.forEach(id=>{const c=doc.qs[id].ch;by[c]=by[c]||{n:0,ok:0};by[c].n++;if(S.ans[id]===0)by[c].ok++});
  const miss=S.ids.filter(id=>S.ans[id]!==0);
  const pass=pct>=80;
  const d=new Date();
  $("#desk").innerHTML = `
    <div class="seal">
      <div class="sh"><span>Giấy niêm phong · Kết quả kiểm đếm</span><span>${doc.no}</span></div>
      <span class="stamp">${pass?"ĐẠT":"CHƯA ĐẠT"}</span>
      <dl>
        <div><dt>Ngày kiểm đếm</dt><dd>${String(d.getDate()).padStart(2,"0")}/${String(d.getMonth()+1).padStart(2,"0")}/${d.getFullYear()}</dd></div>
        <div><dt>Số câu (tờ)</dt><dd>${n}</dd></div>
        <div><dt>Đúng</dt><dd>${ok}</dd></div>
        <div><dt>Tỷ lệ</dt><dd>${pct}%</dd></div>
        <div><dt>Thời gian</dt><dd>${fmt(secs)}</dd></div>
      </dl>
      <div class="verdict">${pass?"Bạn nắm vững nội dung trong phạm vi này.":"Ngưỡng đạt là 80%. Xem lại các câu sai bên dưới, chúng đã được lưu vào mục Ôn câu sai."}</div>
    </div>
    <h3 class="sec">Theo chương</h3>
    <div class="brk">${Object.keys(by).map(c=>`<div><span>${doc.chapters[c]}</span><span class="m"><i style="width:${by[c].ok/by[c].n*100}%"></i></span><span class="v">${by[c].ok}/${by[c].n}</span></div>`).join("")}</div>
    ${miss.length?`<h3 class="sec">Câu cần xem lại (${miss.length})</h3><div class="rev">${miss.map(id=>{const q=doc.qs[id],p=S.ans[id];return `<article><div class="rq">${esc(q.q)}</div><div class="ra">${p===undefined?`<span class="y">Bỏ trống</span>`:`<span class="y">Bạn chọn: ${esc(q.o[p])}</span>`}<span class="r">Đáp án: ${esc(q.o[0])}</span></div><div class="rc">${esc(q.c)} · “${esc(q.ex)}”</div></article>`}).join("")}</div>`:""}
    <div class="nav"><button type="button" class="btn quiet" id="back">Về trang văn bản</button><button type="button" class="btn" id="again">Làm lại</button></div>`;
  const m=S.mode;
  $("#back").onclick=home; $("#again").onclick=()=>start(m==="wrong"&&!store.get("wrong_"+doc.id,[]).length?"practice":m);
}

$("#docs").addEventListener("click",e=>{const b=e.target.closest(".doc[data-id]");if(!b)return;doc=DOCS.find(d=>d.id===b.dataset.id);filter="all";kindOff={};renderDocs();renderStats();home()});
DOCS.forEach(d=>{const cq=CRITQ[d.id]; if(!cq) return;
  d.chapters.PB="Phản biện · Câu hỏi phân tích";
  cq.forEach(q=>d.qs.push(Object.assign({ch:"PB"},q,{c:"Phản biện · "+q.c})));});
renderDocs(); renderStats(); home();
</script>
</body>
</html>

<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Quiz trắc nghiệm và phản biện văn bản pháp luật của Ngân hàng Nhà nước Việt Nam, mỗi đáp án kèm trích dẫn điều khoản.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Quiz Văn bản NHNN</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Spectral:wght@500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: thư viện văn bản bên trái + bàn làm bài bên phải; giao diện mượn từ giấy niêm phong và nét guilloche tiền giấy */
:root{
  --paper:#f3f5f2; --sheet:#ffffff; --ink:#14322b; --ink-2:#4a5f59; --line:#d5ddd8;
  --accent:#0f6b55; --accent-soft:#e2efe9; --seal:#b4232c; --seal-soft:#f8e4e4;
  --ok:#1d7a46; --ok-soft:#e1f2e7; --bad:#b4232c; --bad-soft:#f9e3e3; --amend:#8a5a00; --amend-soft:#f6ecd6;
  --guil:rgba(15,107,85,.07);
  --f-display:"Spectral",Georgia,"Times New Roman",serif;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0d1614; --sheet:#14201d; --ink:#e3ece8; --ink-2:#9db1aa; --line:#2a3a35;
  --accent:#4fc2a0; --accent-soft:#163a30; --seal:#ef6b6f; --seal-soft:#3a1c1e;
  --ok:#5fcf8e; --ok-soft:#173826; --bad:#ef6b6f; --bad-soft:#3d1d1f; --amend:#e3b45a; --amend-soft:#3a2f17;
  --guil:rgba(79,194,160,.06); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0d1614; --sheet:#14201d; --ink:#e3ece8; --ink-2:#9db1aa; --line:#2a3a35;
  --accent:#4fc2a0; --accent-soft:#163a30; --seal:#ef6b6f; --seal-soft:#3a1c1e;
  --ok:#5fcf8e; --ok-soft:#173826; --bad:#ef6b6f; --bad-soft:#3d1d1f; --amend:#e3b45a; --amend-soft:#3a2f17;
  --guil:rgba(79,194,160,.06); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;
  background-image:repeating-radial-gradient(circle at 100% 0,transparent 0 14px,var(--guil) 14px 15px),
                   repeating-radial-gradient(circle at 0 100%,transparent 0 22px,var(--guil) 22px 23px);
  background-attachment:fixed}
.wrap{max-width:1120px;margin:0 auto;padding-block:28px 64px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;margin-bottom:24px}
.brand small{display:block;font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:clamp(28px,4.4vw,40px);line-height:1.1;margin:4px 0 0;text-wrap:balance}
.brand p{margin:6px 0 0;color:var(--ink-2);max-width:60ch}
.stats{display:flex;gap:18px;font-family:var(--f-mono);font-size:12px;color:var(--ink-2)}
.stats b{display:block;font-size:20px;color:var(--ink);font-variant-numeric:tabular-nums}

.grid{display:grid;grid-template-columns:300px minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:860px){.grid{grid-template-columns:minmax(0,1fr)}}

/* Thư viện */
.lib{display:flex;flex-direction:column;gap:12px}
.lib h2{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);margin:0}
.doc{background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:14px 14px 12px;text-align:left;color:inherit;font:inherit;cursor:pointer;width:100%}
.doc.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.doc .no{font-family:var(--f-mono);font-size:12px;color:var(--accent);font-weight:600}
.doc .tt{font-weight:600;margin:4px 0 6px;line-height:1.35}
.doc .meta{font-size:12.5px;color:var(--ink-2);display:grid;gap:2px}
.doc.soon{cursor:default;background:transparent;border-style:dashed;color:var(--ink-2)}
.doc.soon .tt{font-weight:500}
.chain{font-size:12.5px;color:var(--ink-2);border-left:2px solid var(--line);padding-left:10px;display:grid;gap:6px}
.chain b{color:var(--ink);font-weight:600}

/* Bàn làm bài */
.desk{background:var(--sheet);border:1px solid var(--line);border-radius:8px;padding:24px;min-width:0}
@media (max-width:520px){.desk{padding:18px 14px}}
.desk h2{font-family:var(--f-display);font-size:24px;margin:0 0 4px;line-height:1.2;text-wrap:balance}
.lead{color:var(--ink-2);margin:0 0 20px}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:22px}
.mode{border:1px solid var(--line);border-radius:6px;padding:14px;background:var(--paper);text-align:left;font:inherit;color:inherit;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.mode:hover{border-color:var(--accent)}
.mode b{font-size:15px}
.mode span{font-size:13px;color:var(--ink-2)}
.mode .k{font-family:var(--f-mono);font-size:11px;color:var(--accent);letter-spacing:.08em;text-transform:uppercase}
.mode[disabled]{opacity:.5;cursor:not-allowed}
label.fl{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);display:block;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
.chip{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--sheet)}
.chip i{font-style:normal;font-family:var(--f-mono);font-size:11px;opacity:.75;margin-left:4px}
.toc{display:grid;gap:0;border-top:1px solid var(--line)}
.toc div{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px;align-items:baseline}
.toc .c{font-family:var(--f-mono);font-size:12px;color:var(--accent)}
.toc .n{font-family:var(--f-mono);font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}

/* Câu hỏi */
.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;font-family:var(--f-mono);font-size:12px;color:var(--ink-2)}
.prog{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:20px}
.prog i{display:block;height:100%;background:var(--accent);transition:width .25s}
.qtag{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tag{font-family:var(--f-mono);font-size:11px;padding:2px 8px;border-radius:3px;background:var(--accent-soft);color:var(--accent)}
.tag.am{background:var(--amend-soft);color:var(--amend)}
.q{font-size:clamp(17px,2.2vw,19px);font-weight:600;line-height:1.45;margin:0 0 18px;text-wrap:pretty}
.opts{display:grid;gap:10px}
.opt{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;align-items:start;text-align:left;font:inherit;color:inherit;background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:12px 14px;cursor:pointer}
.opt:hover:not([disabled]){border-color:var(--accent);background:var(--accent-soft)}
.opt .l{font-family:var(--f-mono);font-weight:600;width:26px;height:26px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:12px}
.opt[disabled]{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ok .l{background:var(--ok);border-color:var(--ok);color:var(--sheet)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.bad .l{background:var(--bad);border-color:var(--bad);color:var(--sheet)}
.opt.pick{border-color:var(--accent);background:var(--accent-soft)}
.opt.pick .l{background:var(--accent);border-color:var(--accent);color:var(--sheet)}
.basis{margin-top:18px;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.basis .hd{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;padding:10px 14px;background:var(--paper);font-size:13px;font-weight:600}
.basis .hd.ok{color:var(--ok)} .basis .hd.bad{color:var(--bad)}
.basis .hd span{font-family:var(--f-mono);font-weight:400;color:var(--ink-2)}
.basis blockquote{margin:0;padding:12px 14px;font-family:var(--f-display);font-size:16px;line-height:1.5;border-left:3px solid var(--accent)}
.nav{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;margin-top:20px}
.btn{font:inherit;font-weight:600;font-size:14px;border-radius:6px;padding:10px 16px;cursor:pointer;border:1px solid var(--accent);background:var(--accent);color:var(--sheet)}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.quiet{background:transparent;border-color:var(--line);color:var(--ink-2)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.timer{font-variant-numeric:tabular-nums;color:var(--ink)}
.timer.low{color:var(--seal)}

/* Kết quả: phiếu niêm phong */
.seal{border:2px solid var(--seal);border-radius:4px;padding:0;margin-bottom:22px;position:relative;background:var(--sheet)}
.seal .sh{background:var(--seal);color:var(--sheet);font-family:var(--f-mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;padding:6px 14px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.seal dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));margin:0}
.seal dl div{padding:12px 14px;border-right:1px dashed var(--line);border-bottom:1px dashed var(--line)}
.seal dt{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.seal dd{margin:2px 0 0;font-family:var(--f-display);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.seal .verdict{padding:12px 14px;font-weight:600}
.stamp{position:absolute;right:14px;top:34px;border:2px solid var(--seal);color:var(--seal);font-family:var(--f-mono);font-weight:600;font-size:12px;letter-spacing:.1em;padding:4px 8px;transform:rotate(-8deg);border-radius:3px;background:var(--sheet)}
@media (max-width:520px){.stamp{position:static;display:inline-block;margin:10px 14px 0;transform:none}}
.brk{display:grid;gap:8px;margin-bottom:22px}
.brk div{display:grid;grid-template-columns:minmax(0,1fr) 120px 48px;gap:10px;align-items:center;font-size:13.5px}
.brk .m{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.brk .m i{display:block;height:100%;background:var(--accent)}
.brk .v{font-family:var(--f-mono);font-size:12px;text-align:right;font-variant-numeric:tabular-nums}
.rev{display:grid;gap:12px}
.rev article{border:1px solid var(--line);border-radius:6px;padding:12px 14px}
.rev .rq{font-weight:600;margin-bottom:6px}
.rev .ra{font-size:13.5px;display:grid;gap:2px}
.rev .ra .y{color:var(--bad)} .rev .ra .r{color:var(--ok)}
.rev .rc{font-family:var(--f-mono);font-size:11.5px;color:var(--ink-2);margin-top:6px}
.note{font-size:12.5px;color:var(--ink-2);margin-top:22px;border-top:1px solid var(--line);padding-top:12px}
h3.sec{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);margin:0 0 10px;font-weight:600}

/* Thẻ chuyển: Trắc nghiệm / Phản biện */
.tabs{display:flex;gap:0;border-bottom:1px solid var(--line);margin:-4px 0 22px}
.tab{font:inherit;font-weight:600;font-size:14px;background:none;border:0;border-bottom:2px solid transparent;color:var(--ink-2);padding:8px 14px 10px;cursor:pointer;margin-bottom:-1px}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.tab i{font-style:normal;font-family:var(--f-mono);font-size:11px;font-weight:400;margin-left:4px;opacity:.8}

/* Phản biện */
.crit-sum{font-family:var(--f-display);font-size:17px;line-height:1.55;margin:0 0 18px;max-width:68ch}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.pill{font-family:var(--f-mono);font-size:11px;padding:3px 9px;border-radius:999px;border:1px solid currentColor;background:transparent;cursor:pointer;font-weight:600}
.pill.off{opacity:.4}
.k-plus{color:var(--ok)} .k-gap{color:var(--amend)} .k-issue{color:var(--bad)}
.crits{display:grid;gap:14px}
.crit{border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--sheet)}
.crit .ch{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 12px;padding:12px 14px 0}
.crit .ch b{font-size:15.5px;line-height:1.4;flex:1 1 280px;min-width:0}
.crit .ch span{font-family:var(--f-mono);font-size:11.5px;color:var(--ink-2)}
.crit .kind{display:block;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;padding:12px 14px 0;font-weight:600}
.crit p{margin:8px 14px 12px;max-width:72ch}
.crit .rec{margin:0;padding:10px 14px;background:var(--paper);border-top:1px dashed var(--line);font-size:14px}
.crit .rec b{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);display:block;margin-bottom:2px}
.disc{margin:6px 0 0;padding-left:20px;display:grid;gap:8px;max-width:72ch}
.disc li::marker{font-family:var(--f-mono);color:var(--accent)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <small>Ngân hàng Nhà nước Việt Nam · Ôn tập văn bản</small>
      <h1>Quiz Văn bản NHNN</h1>
      <p>Câu hỏi soạn theo đúng điều, khoản của văn bản quy phạm pháp luật và văn bản chỉ đạo. Mỗi đáp án kèm trích dẫn căn cứ.</p>
    </div>
    <div class="stats" id="stats"></div>
  </header>

  <div class="grid">
    <aside class="lib">
      <h2>Thư viện văn bản</h2>
      <div id="docs"></div>
      <div class="doc soon"><div class="tt">Văn bản tiếp theo sẽ được bổ sung</div><div class="meta">Gửi file PDF để thêm bộ câu hỏi mới.</div></div>
    </aside>
    <main class="desk" id="desk"></main>
  </div>
</div>

<script>
const A1="Sửa đổi bởi NĐ 232/2025", A2="Sửa đổi bởi NĐ 390/2026";
const DOCS = [{
  id:"vbhn117",
  no:"117/2026/VBHN-NĐ-NHNN",
  title:"Nghị định về quản lý hoạt động kinh doanh vàng",

  signer:"Phó Thống đốc Đoàn Thái Sơn",
  amTag:"Sửa đổi 2025–2026",

  amLead:"nội dung được Nghị định 232/2025 hoặc Nghị định 390/2026 sửa đổi, bổ sung",
  src:"đối chiếu với Nghị định 24/2012/NĐ-CP, Nghị định 232/2025/NĐ-CP và Nghị định 390/2026/NĐ-CP",
  chain:[
    ["Nghị định 24/2012/NĐ-CP","ngày 03/4/2012, hiệu lực từ 25/5/2012"],
    ["Nghị định 232/2025/NĐ-CP","ngày 26/8/2025, hiệu lực từ 10/10/2025"],
    ["Nghị định 390/2026/NĐ-CP","ngày 16/10/2026, hiệu lực từ 16/10/2026"]
  ],
  chapters:{

  },
  qs:[
  {ch:"X",q:"Văn bản hợp nhất 117/2026/VBHN-NĐ-NHNN hợp nhất những nghị định nào?",o:["Nghị định 24/2012/NĐ-CP, Nghị định 232/2025/NĐ-CP và Nghị định 390/2026/NĐ-CP","Nghị định 174/1999/NĐ-CP, Nghị định 64/2003/NĐ-CP và Nghị định 24/2012/NĐ-CP","Nghị định 24/2012/NĐ-CP và Nghị định 232/2025/NĐ-CP","Nghị định 64/2003/NĐ-CP và Nghị định 390/2026/NĐ-CP"],c:"Phần mở đầu VBHN",ex:"Nghị định số 24/2012/NĐ-CP ngày 03 tháng 4 năm 2012 … được sửa đổi, bổ sung bởi: 1. Nghị định số 232/2025/NĐ-CP … 2. Nghị định số 390/2026/NĐ-CP …"},
  {ch:"X",q:"Nghị định 24/2012/NĐ-CP về quản lý hoạt động kinh doanh vàng có hiệu lực từ ngày nào?",o:["25/5/2012","03/4/2012","01/7/2012","09/12/2012"],c:"Điều 22",ex:"Nghị định này có hiệu lực thi hành kể từ ngày 25 tháng 5 năm 2012 …"},
  {ch:"X",q:"Nghị định 232/2025/NĐ-CP sửa đổi Nghị định 24/2012 có hiệu lực từ ngày nào?",o:["10/10/2025","26/8/2025","01/01/2026","16/10/2025"],c:"Điều 3 khoản 1 NĐ 232/2025",ex:"Nghị định này có hiệu lực thi hành từ ngày 10 tháng 10 năm 2025."},
  {ch:"X",q:"Nghị định 390/2026/NĐ-CP sửa đổi Nghị định 24/2012 có hiệu lực từ ngày nào?",o:["16/10/2026","10/10/2026","28/10/2026","01/12/2026"],c:"Điều 7 khoản 1 NĐ 390/2026",ex:"Nghị định này có hiệu lực thi hành từ ngày 16 tháng 10 năm 2026."},
  {ch:"X",q:"Nghị định 24/2012/NĐ-CP thay thế những văn bản nào?",o:["Nghị định 174/1999/NĐ-CP và Nghị định 64/2003/NĐ-CP","Nghị định 64/2003/NĐ-CP và Quyết định 3/2006/QĐ-NHNN","Chỉ Nghị định 174/1999/NĐ-CP","Nghị định 161/2006/NĐ-CP"],c:"Điều 22",ex:"… thay thế Nghị định số 174/1999/NĐ-CP ngày 09 tháng 12 năm 1999 của Chính phủ về quản lý hoạt động kinh doanh vàng và Nghị định số 64/2003/NĐ-CP ngày 11 tháng 6 năm 2003 …"},
  {ch:"X",q:"Theo Nghị định 232/2025, Công ty SJC được phép gia công lại loại vàng miếng nào?",o:["Vàng miếng SJC do Công ty SJC sản xuất trước ngày NĐ có hiệu lực, bị trầy xước hoặc bị đóng thêm dấu hiệu không phải của SJC","Mọi loại vàng miếng của các thương hiệu trong nước","Vàng miếng nhập khẩu có hàm lượng từ 99,5% trở lên","Vàng miếng do NHNN tổ chức sản xuất"],c:"Điều 3 khoản 2 NĐ 232/2025",ex:"Công ty SJC được phép gia công lại vàng miếng từ vàng miếng SJC do Công ty SJC đã sản xuất, gia công trước ngày Nghị định này có hiệu lực thi hành, có ít nhất một trong các đặc điểm: bị trầy xước; bị đóng thêm các dấu hiệu, ký hiệu không phải của Công ty SJC.",am:A1},
  {ch:"X",q:"Từ ngày Nghị định 390/2026 có hiệu lực, Giấy chứng nhận đủ điều kiện sản xuất vàng trang sức, mỹ nghệ đã cấp trước đó có giá trị thế nào?",o:["Không còn là điều kiện để thực hiện hoạt động sản xuất vàng trang sức, mỹ nghệ","Tiếp tục có hiệu lực đến hết thời hạn ghi trên giấy","Phải đổi sang Giấy phép sản xuất vàng miếng","Hết hiệu lực và doanh nghiệp phải ngừng sản xuất"],c:"Điều 7 khoản 2 NĐ 390/2026",ex:"Giấy chứng nhận đủ điều kiện sản xuất vàng trang sức, mỹ nghệ do Ngân hàng Nhà nước cấp trước ngày Nghị định này có hiệu lực thi hành không còn là điều kiện để tổ chức, cá nhân thực hiện hoạt động sản xuất vàng trang sức, mỹ nghệ.",am:A2},
  {ch:"X",q:"Hồ sơ đề nghị cấp Giấy chứng nhận đủ điều kiện sản xuất vàng trang sức, mỹ nghệ nộp trước ngày NĐ 390/2026 có hiệu lực mà chưa giải quyết thì xử lý thế nào?",o:["NHNN chấm dứt việc giải quyết và thông báo cho người nộp hồ sơ","NHNN tiếp tục giải quyết theo quy định cũ","Chuyển hồ sơ sang Bộ Công Thương","Tự động được cấp Giấy chứng nhận"],c:"Điều 7 khoản 3 NĐ 390/2026",ex:"… chưa được giải quyết thì Ngân hàng Nhà nước chấm dứt việc giải quyết và thông báo cho tổ chức, cá nhân nộp hồ sơ. Phí, lệ phí đã nộp, nếu có, được xử lý theo quy định của pháp luật về phí, lệ phí.",am:A2},
  {ch:"X",q:"Giấy phép xuất khẩu, nhập khẩu vàng và hạn mức đã được NHNN cấp trước ngày NĐ 390/2026 có hiệu lực được xử lý thế nào?",o:["Tiếp tục thực hiện theo nội dung, thời hạn ghi tại giấy phép, hạn mức, trừ trường hợp bị điều chỉnh, thu hồi","Hết hiệu lực ngay từ ngày 16/10/2026","Phải làm thủ tục cấp lại trong 12 tháng","Được tự động gia hạn thêm 1 năm"],c:"Điều 7 khoản 4 NĐ 390/2026",ex:"… được tiếp tục thực hiện theo nội dung, thời hạn ghi tại giấy phép, hạn mức, trừ trường hợp bị điều chỉnh, thu hồi theo quy định của pháp luật.",am:A2},

  {ch:"I",q:"Nghị định về quản lý hoạt động kinh doanh vàng KHÔNG áp dụng đối với hoạt động nào?",o:["Hoạt động khai thác và tinh luyện vàng của doanh nghiệp khai thác vàng","Hoạt động sản xuất vàng miếng","Hoạt động kinh doanh vàng trên tài khoản","Hoạt động xuất khẩu, nhập khẩu vàng"],c:"Điều 1 khoản 2",ex:"Các quy định của Nghị định này không áp dụng đối với hoạt động khai thác và tinh luyện vàng của doanh nghiệp khai thác vàng."},
  {ch:"I",q:"Phạm vi điều chỉnh nêu rõ “các hoạt động kinh doanh vàng khác” bao gồm cả những hoạt động nào?",o:["Kinh doanh vàng trên tài khoản và hoạt động phái sinh về vàng","Cầm đồ vàng và cho vay bằng vàng","Huy động vốn bằng vàng","Khai thác và tinh luyện vàng"],c:"Điều 1 khoản 1",ex:"… các hoạt động kinh doanh vàng khác, bao gồm cả hoạt động kinh doanh vàng trên tài khoản và hoạt động phái sinh về vàng.",am:A1},
  {ch:"I",q:"Vàng trang sức, mỹ nghệ là sản phẩm vàng có hàm lượng tối thiểu bao nhiêu?",o:["Từ 8 Kara (tương đương 33,33%) trở lên","Từ 10 Kara (tương đương 41,67%) trở lên","Từ 14 Kara (tương đương 58,33%) trở lên","Từ 18 Kara (tương đương 75%) trở lên"],c:"Điều 3 khoản 1",ex:"Vàng trang sức, mỹ nghệ là các sản phẩm vàng có hàm lượng từ 8 Kara (tương đương 33,33%) trở lên, đã qua gia công, chế tác để phục vụ nhu cầu trang sức, trang trí mỹ thuật."},
  {ch:"I",q:"Theo định nghĩa sau sửa đổi, vàng miếng có ký mã hiệu của ai?",o:["Doanh nghiệp và ngân hàng thương mại được NHNN cho phép sản xuất","Chỉ Công ty SJC","Bất kỳ doanh nghiệp kinh doanh vàng nào","Bộ Khoa học và Công nghệ"],c:"Điều 3 khoản 2",ex:"Vàng miếng là sản phẩm vàng được dập thành miếng, có đóng chữ, số chỉ khối lượng, chất lượng, có ký mã hiệu của doanh nghiệp và ngân hàng thương mại được Ngân hàng Nhà nước cho phép sản xuất; vàng miếng do Ngân hàng Nhà nước tổ chức sản xuất trong từng thời kỳ.",am:A1},
  {ch:"I",q:"Vàng nguyên liệu được định nghĩa là gì?",o:["Vàng dưới dạng khối, thỏi, hạt, miếng và các loại vàng khác","Vàng có hàm lượng từ 99,99% trở lên","Vàng chưa qua tinh luyện tại mỏ","Vàng trang sức dạng bán thành phẩm"],c:"Điều 3 khoản 3",ex:"Vàng nguyên liệu là vàng dưới dạng khối, thỏi, hạt, miếng và các loại vàng khác."},
  {ch:"I",q:"Hoạt động kinh doanh vàng trên tài khoản được hiểu là gì?",o:["Kinh doanh vàng qua tài khoản, dưới hình thức giao dịch ký quỹ và giá trị ròng được định giá lại liên tục theo biến động giá vàng","Gửi vàng tiết kiệm tại ngân hàng","Mua bán vàng miếng qua ứng dụng ngân hàng có giao vàng vật chất","Thanh toán mua vàng bằng chuyển khoản"],c:"Điều 3 khoản 4",ex:"Hoạt động kinh doanh vàng trên tài khoản là hoạt động kinh doanh vàng qua tài khoản, dưới hình thức giao dịch ký quỹ và giá trị ròng được định giá lại liên tục theo biến động của giá vàng."},
  {ch:"I",q:"Cơ quan nào thay mặt Chính phủ thống nhất quản lý các hoạt động kinh doanh vàng?",o:["Ngân hàng Nhà nước","Bộ Công Thương","Bộ Tài chính","Bộ Khoa học và Công nghệ"],c:"Điều 4 khoản 2",ex:"Ngân hàng Nhà nước là cơ quan thay mặt Chính phủ thống nhất quản lý các hoạt động kinh doanh vàng theo quy định tại Nghị định này."},
  {ch:"I",q:"Sau sửa đổi bởi NĐ 390/2026, quản lý hoạt động kinh doanh vàng nhằm mục tiêu gì?",o:["Phát triển ổn định và bền vững thị trường vàng","Chống vàng hóa nền kinh tế","Huy động nguồn lực vàng trong dân","Tăng dự trữ ngoại hối nhà nước"],c:"Điều 4 khoản 4",ex:"Quản lý hoạt động kinh doanh vàng nhằm phát triển ổn định và bền vững thị trường vàng.",am:A2},
  {ch:"I",q:"Hoạt động sản xuất vàng miếng, kinh doanh mua, bán vàng miếng được xác định là gì?",o:["Hoạt động kinh doanh có điều kiện, phải được NHNN cấp Giấy phép","Độc quyền nhà nước, chỉ NHNN được thực hiện","Hoạt động tự do, chỉ cần đăng ký doanh nghiệp","Hoạt động cấm kinh doanh"],c:"Điều 4 khoản 6",ex:"Hoạt động sản xuất vàng miếng, kinh doanh mua, bán vàng miếng là hoạt động kinh doanh có điều kiện và phải được Ngân hàng Nhà nước cấp Giấy phép sản xuất vàng miếng, Giấy phép kinh doanh mua, bán vàng miếng.",am:A2},
  {ch:"I",q:"Theo NĐ 390/2026, hoạt động sản xuất, gia công, kinh doanh mua, bán vàng trang sức, mỹ nghệ có phải là ngành, nghề đầu tư kinh doanh có điều kiện không?",o:["Không phải ngành, nghề đầu tư kinh doanh có điều kiện","Có, phải có Giấy chứng nhận đủ điều kiện của NHNN","Có, phải có Giấy phép của Bộ Công Thương","Là hoạt động thuộc danh mục hạn chế kinh doanh"],c:"Điều 4 khoản 7",ex:"Hoạt động sản xuất, gia công, kinh doanh mua, bán vàng trang sức, mỹ nghệ không phải là ngành, nghề đầu tư kinh doanh có điều kiện.",am:A2},
  {ch:"I",q:"Hoạt động phái sinh về vàng của ngân hàng thương mại, chi nhánh ngân hàng nước ngoài thực hiện theo quy định nào?",o:["Điều 112 Luật Các tổ chức tín dụng","Điều 11a Nghị định 24/2012","Luật Chứng khoán","Quyết định riêng của Thủ tướng Chính phủ"],c:"Điều 4 khoản 8",ex:"Hoạt động phái sinh về vàng của các ngân hàng thương mại, chi nhánh ngân hàng nước ngoài thực hiện theo Điều 112 Luật Các tổ chức tín dụng.",am:A1},
  {ch:"I",q:"Tổ chức, cá nhân chỉ được thực hiện “các hoạt động kinh doanh vàng khác” khi nào?",o:["Sau khi được Thủ tướng Chính phủ cho phép và được NHNN cấp Giấy phép","Sau khi đăng ký với Bộ Công Thương","Sau khi được NHNN chấp thuận bằng văn bản","Sau khi có Giấy chứng nhận đăng ký doanh nghiệp"],c:"Điều 4 khoản 9",ex:"Tổ chức, cá nhân chỉ được thực hiện các hoạt động kinh doanh vàng khác sau khi được Thủ tướng Chính phủ cho phép và được Ngân hàng Nhà nước cấp Giấy phép."},
  {ch:"I",q:"Mua, bán vàng có giá trị từ bao nhiêu trong ngày của một khách hàng thì phải thanh toán không dùng tiền mặt?",o:["Từ 05 triệu đồng trở lên","Từ 20 triệu đồng trở lên","Từ 100 triệu đồng trở lên","Từ 300 triệu đồng trở lên"],c:"Điều 4 khoản 10",ex:"Việc thanh toán mua, bán vàng có giá trị từ 05 triệu đồng trong ngày trở lên của một khách hàng phải được thực hiện bằng phương tiện thanh toán không dùng tiền mặt.",am:A2},

  {ch:"III",q:"Hoạt động mua, bán vàng miếng của tổ chức, cá nhân chỉ được thực hiện tại đâu?",o:["Tổ chức tín dụng và doanh nghiệp được NHNN cấp Giấy phép kinh doanh mua, bán vàng miếng","Bất kỳ cửa hàng vàng bạc có đăng ký kinh doanh","Sở Giao dịch NHNN","Sàn giao dịch vàng"],c:"Điều 10",ex:"Hoạt động mua, bán vàng miếng của các tổ chức, cá nhân chỉ được thực hiện tại các tổ chức tín dụng và doanh nghiệp được Ngân hàng Nhà nước cấp Giấy phép kinh doanh mua, bán vàng miếng."},
  {ch:"III",q:"Doanh nghiệp xin Giấy phép kinh doanh mua, bán vàng miếng phải có vốn điều lệ tối thiểu bao nhiêu?",o:["100 tỷ đồng","50 tỷ đồng","500 tỷ đồng","1.000 tỷ đồng"],c:"Điều 11 khoản 1 điểm b",ex:"b) Có vốn điều lệ từ 100 tỷ đồng trở lên."},
  {ch:"III",q:"Doanh nghiệp xin Giấy phép kinh doanh mua, bán vàng miếng phải có kinh nghiệm trong lĩnh vực mua, bán vàng tối thiểu bao lâu?",o:["2 năm","1 năm","3 năm","5 năm"],c:"Điều 11 khoản 1 điểm c",ex:"c) Có kinh nghiệm hoạt động trong lĩnh vực kinh doanh mua, bán vàng từ 2 (hai) năm trở lên."},
  {ch:"III",q:"Điều kiện về số thuế đã nộp của doanh nghiệp xin Giấy phép kinh doanh mua, bán vàng miếng là gì?",o:["Từ 500 triệu đồng/năm trở lên trong 2 năm liên tiếp gần nhất, có xác nhận của cơ quan thuế","Từ 1 tỷ đồng/năm trong 3 năm gần nhất","Từ 500 triệu đồng trong năm gần nhất","Từ 200 triệu đồng/năm trong 2 năm liên tiếp"],c:"Điều 11 khoản 1 điểm d",ex:"d) Có số thuế đã nộp của hoạt động kinh doanh vàng từ 500 (năm trăm) triệu đồng/năm trở lên trong 2 (hai) năm liên tiếp gần nhất (có xác nhận của cơ quan thuế)."},
  {ch:"III",q:"Doanh nghiệp xin Giấy phép kinh doanh mua, bán vàng miếng phải có mạng lưới chi nhánh, địa điểm bán hàng tại tối thiểu bao nhiêu tỉnh, thành phố trực thuộc Trung ương?",o:["3","2","5","10"],c:"Điều 11 khoản 1 điểm đ",ex:"đ) Có mạng lưới chi nhánh, địa điểm bán hàng tại Việt Nam từ 3 (ba) tỉnh, thành phố trực thuộc Trung ương trở lên."},
  {ch:"III",q:"Tổ chức tín dụng xin Giấy phép kinh doanh mua, bán vàng miếng phải có vốn điều lệ tối thiểu bao nhiêu?",o:["3.000 tỷ đồng","1.000 tỷ đồng","5.000 tỷ đồng","50.000 tỷ đồng"],c:"Điều 11 khoản 2 điểm a",ex:"a) Có vốn điều lệ từ 3.000 (ba nghìn) tỷ đồng trở lên."},
  {ch:"III",q:"Tổ chức tín dụng xin Giấy phép kinh doanh mua, bán vàng miếng phải có mạng lưới chi nhánh tại tối thiểu bao nhiêu tỉnh, thành phố?",o:["5","3","10","63"],c:"Điều 11 khoản 2 điểm c",ex:"c) Có mạng lưới chi nhánh tại Việt Nam từ 5 (năm) tỉnh, thành phố trực thuộc Trung ương trở lên."},
  {ch:"III",q:"Doanh nghiệp xin Giấy phép sản xuất vàng miếng phải có vốn điều lệ tối thiểu bao nhiêu?",o:["1.000 tỷ đồng","100 tỷ đồng","3.000 tỷ đồng","50.000 tỷ đồng"],c:"Điều 11a khoản 1 điểm b",ex:"b) Có vốn điều lệ từ 1.000 tỷ đồng trở lên.",am:A1},
  {ch:"III",q:"Ngân hàng thương mại xin Giấy phép sản xuất vàng miếng phải có vốn điều lệ tối thiểu bao nhiêu?",o:["50.000 tỷ đồng","3.000 tỷ đồng","10.000 tỷ đồng","1.000 tỷ đồng"],c:"Điều 11a khoản 2 điểm b",ex:"b) Có vốn điều lệ từ 50.000 tỷ đồng trở lên.",am:A1},
  {ch:"III",q:"Để được cấp Giấy phép sản xuất vàng miếng, doanh nghiệp và ngân hàng thương mại trước hết phải có loại giấy phép nào?",o:["Giấy phép kinh doanh mua, bán vàng miếng","Giấy phép khai thác vàng","Giấy chứng nhận đủ điều kiện sản xuất vàng trang sức, mỹ nghệ","Giấy phép nhập khẩu vàng nguyên liệu"],c:"Điều 11a khoản 1, 2 điểm a",ex:"a) Có Giấy phép kinh doanh mua, bán vàng miếng.",am:A1},
  {ch:"III",q:"Đơn vị từng bị xử phạt vi phạm hành chính về kinh doanh vàng có được cấp Giấy phép sản xuất vàng miếng không?",o:["Được, nếu đã thực hiện xong biện pháp khắc phục hậu quả và các kiến nghị có thời hạn tại kết luận thanh tra, kiểm tra","Không bao giờ được cấp","Được, sau 5 năm kể từ ngày bị xử phạt","Được, nếu nộp gấp đôi tiền phạt"],c:"Điều 11a khoản 1 điểm c",ex:"Không bị xử phạt vi phạm hành chính về hoạt động kinh doanh vàng hoặc bị xử phạt … nhưng đã thực hiện xong các biện pháp khắc phục hậu quả theo Quyết định xử phạt vi phạm hành chính, các kiến nghị có thời hạn thực hiện tại Kết luận thanh tra, kiểm tra …",am:A1},
  {ch:"III",q:"Nội dung nào KHÔNG thuộc nội dung cơ bản của quy định nội bộ về sản xuất vàng miếng?",o:["Quy trình phân phối vàng miếng qua đại lý","Quy trình nhập nguyên liệu","Quy trình giám sát sản xuất","Quy trình kiểm soát chất lượng sản phẩm"],c:"Điều 11a khoản 1 điểm d",ex:"Có quy định nội bộ quy định về sản xuất vàng miếng bao gồm những nội dung cơ bản như quy trình nhập nguyên liệu; quy trình sản xuất vàng miếng; quy trình giám sát sản xuất; quy trình kiểm soát chất lượng sản phẩm.",am:A1},
  {ch:"III",q:"Ai quy định hồ sơ, thủ tục cấp Giấy phép sản xuất vàng miếng?",o:["Thống đốc NHNN","Thủ tướng Chính phủ","Bộ trưởng Bộ Công Thương","Bộ trưởng Bộ Tài chính"],c:"Điều 11a khoản 3",ex:"Thống đốc Ngân hàng Nhà nước quy định hồ sơ, thủ tục cấp Giấy phép sản xuất vàng miếng.",am:A1},
  {ch:"III",q:"Doanh nghiệp, tổ chức tín dụng kinh doanh mua, bán vàng miếng có được kinh doanh thông qua đại lý ủy nhiệm không?",o:["Không được phép","Được, nếu đăng ký với NHNN","Được, tối đa 10 đại lý","Được, nếu đại lý có Giấy chứng nhận đăng ký doanh nghiệp"],c:"Điều 12 khoản 4 điểm b",ex:"b) Không được phép thực hiện kinh doanh vàng miếng thông qua các đại lý ủy nhiệm.",am:A1},
  {ch:"III",q:"Đơn vị kinh doanh mua, bán vàng miếng phải niêm yết giá mua, giá bán ở đâu?",o:["Tại địa điểm giao dịch hoặc trên trang thông tin điện tử, và kết nối cung cấp giá niêm yết cho NHNN","Chỉ trên trang thông tin điện tử của NHNN","Chỉ tại trụ sở chính","Trên báo in hằng ngày"],c:"Điều 12 khoản 4 điểm a",ex:"a) Niêm yết công khai giá mua, giá bán vàng miếng tại địa điểm giao dịch hoặc trên trang thông tin điện tử và kết nối cung cấp thông tin về mức giá niêm yết cho Ngân hàng Nhà nước.",am:A1},
  {ch:"III",q:"Hệ thống thông tin lưu trữ dữ liệu giao dịch mua bán vàng miếng phải có nội dung cơ bản nào?",o:["Thông tin căn cước (cá nhân), mã số thuế (doanh nghiệp), khối lượng và giá trị giao dịch của bên mua, bán","Chỉ số hóa đơn và tổng giá trị giao dịch","Số tài khoản ngân hàng của khách hàng","Nghề nghiệp và thu nhập của khách hàng"],c:"Điều 12 khoản 4 điểm đ",ex:"… có những nội dung cơ bản bao gồm thông tin căn cước đối với cá nhân, mã số thuế doanh nghiệp đối với doanh nghiệp, khối lượng và giá trị giao dịch của bên mua, bán.",am:A1},
  {ch:"III",q:"Hệ thống thông tin dữ liệu vàng miếng được sản xuất phải có những nội dung cơ bản nào?",o:["Thông tin nguyên liệu đầu vào, thời gian sản xuất, sản phẩm đầu ra","Danh sách khách hàng mua vàng miếng","Giá thành và lợi nhuận từng lô sản xuất","Số lượng nhân công và máy móc"],c:"Điều 12 khoản 3 điểm c",ex:"Xây dựng hệ thống thông tin xử lý, lưu trữ dữ liệu vàng miếng được sản xuất có những nội dung cơ bản bao gồm thông tin nguyên liệu đầu vào, thời gian sản xuất, sản phẩm đầu ra.",am:A1},

  {ch:"IV",q:"Xuất khẩu, nhập khẩu vàng trang sức, mỹ nghệ được thực hiện theo căn cứ nào?",o:["Giấy chứng nhận đăng ký kinh doanh hoặc Giấy chứng nhận đăng ký doanh nghiệp","Giấy phép từng lần của NHNN","Hạn mức hằng năm do NHNN cấp","Quyết định của Thủ tướng Chính phủ"],c:"Điều 13 khoản 1",ex:"Việc xuất khẩu, nhập khẩu vàng trang sức, mỹ nghệ được thực hiện theo Giấy chứng nhận đăng ký kinh doanh hoặc Giấy chứng nhận đăng ký doanh nghiệp."},
  {ch:"IV",q:"NHNN cấp hạn mức hằng năm và Giấy phép từng lần để xuất khẩu, nhập khẩu vàng miếng cho đối tượng nào?",o:["Doanh nghiệp, ngân hàng thương mại được cấp Giấy phép sản xuất vàng miếng (Điều 11a)","Mọi doanh nghiệp có Giấy phép kinh doanh mua, bán vàng miếng","Mọi tổ chức tín dụng","Doanh nghiệp có vốn đầu tư nước ngoài"],c:"Điều 14 khoản 1",ex:"Ngân hàng Nhà nước cấp hạn mức hàng năm và Giấy phép từng lần cho doanh nghiệp, ngân hàng thương mại quy định tại Điều 11a Nghị định này để xuất khẩu, nhập khẩu vàng miếng …",am:A1},
  {ch:"IV",q:"Doanh nghiệp, ngân hàng được cấp phép chỉ được nhập khẩu vàng miếng, vàng nguyên liệu có hàm lượng từ bao nhiêu trở lên?",o:["99,5%","99,99%","99,0%","95%"],c:"Điều 14 khoản 10 điểm a",ex:"a) Chỉ được phép nhập khẩu vàng miếng, vàng nguyên liệu có hàm lượng từ 99,5% trở lên.",am:A1},
  {ch:"IV",q:"Hoạt động xuất khẩu, nhập khẩu vàng nguyên liệu của NHNN được hưởng ưu đãi gì?",o:["Miễn thuế xuất khẩu, thuế nhập khẩu theo quyết định của Thủ tướng Chính phủ","Giảm 50% thuế nhập khẩu","Không phải khai báo hải quan","Không có ưu đãi riêng"],c:"Điều 14 khoản 3",ex:"Hoạt động xuất khẩu, nhập khẩu vàng nguyên liệu của Ngân hàng Nhà nước được miễn thuế xuất khẩu, thuế nhập khẩu theo quyết định của Thủ tướng Chính phủ."},
  {ch:"IV",q:"Giấy phép xuất khẩu vàng nguyên liệu do doanh nghiệp khai thác được cấp cho đối tượng nào?",o:["Doanh nghiệp có vốn đầu tư nước ngoài có Giấy phép khai thác vàng, vàng khai thác ở trong nước","Mọi doanh nghiệp khai thác vàng trong nước","Doanh nghiệp đầu tư khai thác vàng ở nước ngoài","Ngân hàng thương mại sản xuất vàng miếng"],c:"Điều 14 khoản 7",ex:"a) Là doanh nghiệp có vốn đầu tư nước ngoài có Giấy phép khai thác vàng; b) Vàng nguyên liệu dự kiến xuất khẩu là do doanh nghiệp khai thác ở trong nước."},
  {ch:"IV",q:"Doanh nghiệp đầu tư khai thác vàng ở nước ngoài được xem xét cấp Giấy phép nhập khẩu vàng nguyên liệu khi nào?",o:["Có đăng ký khai thác vàng trong Giấy chứng nhận đầu tư và vàng nhập khẩu do doanh nghiệp khai thác hoặc được phân chia ở nước ngoài","Có vốn điều lệ từ 1.000 tỷ đồng","Có Giấy phép kinh doanh mua, bán vàng miếng","Có hợp đồng bán vàng cho NHNN"],c:"Điều 14 khoản 6",ex:"a) Là doanh nghiệp có đăng ký hoạt động khai thác vàng trong Giấy chứng nhận đầu tư; b) Vàng nguyên liệu dự kiến nhập khẩu là do doanh nghiệp khai thác ở nước ngoài hoặc được phân chia sản phẩm theo thỏa thuận khai thác vàng ở nước ngoài."},
  {ch:"IV",q:"Vàng nguyên liệu dạng bột, dung dịch, vẩy hàn, muối vàng, dây, ống được xuất khẩu, nhập khẩu theo căn cứ nào?",o:["Giấy chứng nhận đăng ký doanh nghiệp, pháp luật về hải quan và pháp luật chuyên ngành","Giấy phép từng lần của NHNN","Hạn mức hằng năm của NHNN","Quyết định của Thủ tướng Chính phủ"],c:"Điều 14 khoản 8",ex:"Việc xuất khẩu, nhập khẩu các loại vàng sau đây được thực hiện theo Giấy chứng nhận đăng ký doanh nghiệp, pháp luật về hải quan và các quy định pháp luật chuyên ngành có liên quan: a) Vàng nguyên liệu dưới dạng bột, dung dịch, vẩy hàn, muối vàng, dây, ống …",am:A2},
  {ch:"IV",q:"Vàng dùng làm nguyên liệu sản xuất loại sản phẩm nào được xuất khẩu, nhập khẩu theo Giấy chứng nhận đăng ký doanh nghiệp mà không cần giấy phép của NHNN?",o:["Linh kiện điện tử, thiết bị điện tử, thiết bị y tế, dụng cụ y tế","Vàng miếng","Vàng trang sức thành phẩm","Đồ mỹ nghệ xuất khẩu"],c:"Điều 14 khoản 8 điểm b",ex:"b) Vàng sử dụng làm nguyên liệu để sản xuất linh kiện điện tử, thiết bị điện tử, thiết bị y tế, dụng cụ y tế.",am:A2},
  {ch:"IV",q:"Mục đích nào KHÔNG thuộc các mục đích được phép sử dụng vàng nguyên liệu nhập khẩu?",o:["Bán cho cá nhân để tích trữ","Sản xuất vàng miếng","Bán cho doanh nghiệp, ngân hàng thương mại được cấp Giấy phép sản xuất vàng miếng","Bán cho doanh nghiệp có đăng ký sản xuất vàng trang sức, mỹ nghệ"],c:"Điều 14 khoản 10 điểm đ",ex:"đ.1) Sản xuất vàng miếng; đ.2) Sản xuất vàng trang sức, mỹ nghệ; đ.3) Bán cho doanh nghiệp, ngân hàng thương mại được cấp Giấy phép sản xuất vàng miếng; đ.4) Bán cho doanh nghiệp có đăng ký hoạt động sản xuất vàng trang sức, mỹ nghệ.",am:A2},
  {ch:"IV",q:"Hằng năm, NHNN xem xét cấp Giấy phép nhập khẩu vàng nguyên liệu cho doanh nghiệp có vốn đầu tư nước ngoài căn cứ vào đâu?",o:["Năng lực sản xuất, tình hình thực hiện hợp đồng gia công hoặc xuất khẩu và báo cáo xuất khẩu vàng trang sức năm trước","Vốn điều lệ và số thuế đã nộp","Mạng lưới chi nhánh tại Việt Nam","Giá vàng thế giới năm trước"],c:"Điều 14 khoản 5",ex:"Hằng năm, Ngân hàng Nhà nước xem xét cấp Giấy phép nhập khẩu vàng nguyên liệu cho doanh nghiệp có vốn đầu tư nước ngoài căn cứ vào năng lực sản xuất, tình hình thực hiện hợp đồng gia công hoặc hợp đồng xuất khẩu vàng trang sức, mỹ nghệ và báo cáo tình hình xuất khẩu vàng trang sức, mỹ nghệ của năm trước, nếu có …",am:A2},
  {ch:"IV",q:"Người Việt Nam và người nước ngoài khi xuất cảnh, nhập cảnh được mang theo vàng theo quy định của cơ quan nào?",o:["Ngân hàng Nhà nước","Tổng cục Hải quan","Bộ Công an","Bộ Tài chính"],c:"Điều 15",ex:"Người Việt Nam và người nước ngoài khi xuất cảnh, nhập cảnh qua các cửa khẩu quốc tế được mang theo vàng theo quy định của Ngân hàng Nhà nước."},

  {ch:"V",q:"NHNN xây dựng chiến lược, kế hoạch phát triển thị trường vàng theo hướng nào?",o:["Thị trường hóa","Độc quyền nhà nước","Hạn chế giao dịch vàng","Chống vàng hóa"],c:"Điều 16 khoản 1",ex:"Xây dựng, trình cấp có thẩm quyền ban hành chiến lược, kế hoạch về phát triển thị trường vàng theo hướng thị trường hóa.",am:A1},
  {ch:"V",q:"Yếu tố nào KHÔNG phải căn cứ để NHNN xây dựng, điều chỉnh tổng hạn mức xuất khẩu, nhập khẩu vàng hằng năm?",o:["Giá vàng thế giới bình quân năm trước","Tình hình kinh tế vĩ mô và mục tiêu điều hành chính sách tiền tệ","Quy mô dự trữ ngoại hối nhà nước","Tình hình thực hiện xuất khẩu, nhập khẩu vàng miếng, vàng nguyên liệu"],c:"Điều 16 khoản 2",ex:"a) Tình hình kinh tế vĩ mô và mục tiêu điều hành chính sách tiền tệ; b) Quy mô dự trữ ngoại hối nhà nước; c) Tình hình thực hiện hoạt động xuất khẩu, nhập khẩu vàng miếng, vàng nguyên liệu.",am:A1},
  {ch:"V",q:"NHNN cấp hạn mức hằng năm cho từng doanh nghiệp, ngân hàng thương mại dựa trên những yếu tố nào?",o:["Quy mô vốn điều lệ, tình hình xuất nhập khẩu các năm trước và nhu cầu của đơn vị","Thứ tự nộp hồ sơ","Số lượng chi nhánh","Thị phần vàng trang sức"],c:"Điều 16 khoản 2",ex:"… cấp hạn mức hàng năm cho doanh nghiệp, ngân hàng thương mại theo quy mô vốn điều lệ …; tình hình xuất khẩu, nhập khẩu vàng miếng, vàng nguyên liệu của các năm trước (nếu có) và nhu cầu của doanh nghiệp, ngân hàng thương mại.",am:A1},
  {ch:"V",q:"NHNN đăng tải giá vàng nào trên trang thông tin điện tử của mình?",o:["Giá mua, giá bán vàng miếng do doanh nghiệp, tổ chức tín dụng được cấp phép kinh doanh mua, bán vàng miếng cung cấp","Giá vàng thế giới quy đổi","Giá vàng trang sức bình quân","Giá vàng do NHNN tự xác định"],c:"Điều 16 khoản 6",ex:"Ngân hàng Nhà nước đăng tải trên trang thông tin điện tử Ngân hàng Nhà nước giá mua, giá bán vàng miếng do doanh nghiệp, tổ chức tín dụng được Ngân hàng Nhà nước cấp Giấy phép kinh doanh mua, bán vàng miếng cung cấp.",am:A1},
  {ch:"V",q:"Bộ nào chủ trì quản lý, kiểm tra hoạt động sản xuất, gia công và mua, bán vàng trang sức, mỹ nghệ?",o:["Bộ Công Thương","Ngân hàng Nhà nước","Bộ Tài chính","Bộ Khoa học và Công nghệ"],c:"Điều 17 khoản 1",ex:"Bộ Công Thương chủ trì, phối hợp với các cơ quan có liên quan thực hiện chức năng quản lý, kiểm tra hoạt động sản xuất, gia công vàng trang sức, mỹ nghệ; hoạt động kinh doanh mua, bán vàng trang sức, mỹ nghệ …",am:A1},
  {ch:"V",q:"Bộ nào chủ trì xây dựng, công bố tiêu chuẩn quốc gia đối với vàng trang sức, mỹ nghệ và vàng miếng?",o:["Bộ Khoa học và Công nghệ","Bộ Công Thương","Ngân hàng Nhà nước","Bộ Tài chính"],c:"Điều 17 khoản 3",ex:"Bộ Khoa học và Công nghệ chủ trì, phối hợp với Ngân hàng Nhà nước và các cơ quan liên quan có trách nhiệm xây dựng, công bố tiêu chuẩn quốc gia đối với vàng trang sức, mỹ nghệ và vàng miếng …",am:A2},
  {ch:"V",q:"Bộ Tài chính chủ trì nội dung nào trong quản lý kinh doanh vàng?",o:["Chính sách thuế đối với kinh doanh vàng và hướng dẫn cấp Giấy chứng nhận đăng ký doanh nghiệp kinh doanh vàng","Cấp Giấy phép sản xuất vàng miếng","Kiểm định phương tiện đo lường","Điều tra tội phạm về kinh doanh vàng"],c:"Điều 17 khoản 2",ex:"Bộ Tài chính chủ trì … chính sách thuế xuất khẩu, thuế nhập khẩu vàng, thuế giá trị gia tăng, thuế tiêu thụ đặc biệt và thuế thu nhập …; quy định, hướng dẫn thực hiện cấp Giấy chứng nhận đăng ký doanh nghiệp cho các doanh nghiệp kinh doanh vàng …",am:A1},
  {ch:"V",q:"Ai chỉ đạo công tác thanh tra, kiểm tra hoạt động kinh doanh vàng tại địa phương?",o:["Chủ tịch Ủy ban nhân dân tỉnh, thành phố trực thuộc trung ương","Giám đốc NHNN chi nhánh Khu vực","Giám đốc Sở Công Thương","Chánh Thanh tra Chính phủ"],c:"Điều 17 khoản 6",ex:"Chủ tịch Ủy ban nhân dân tỉnh, thành phố trực thuộc trung ương chỉ đạo việc thực hiện công tác thanh tra, kiểm tra hoạt động kinh doanh vàng tại địa phương.",am:A1},

  {ch:"VI",q:"Hành vi nào sau đây là hành vi vi phạm trong hoạt động kinh doanh vàng?",o:["Sử dụng vàng làm phương tiện thanh toán","Mua vàng trang sức tại cửa hàng có đăng ký kinh doanh","Nhập khẩu vàng nguyên liệu dạng muối vàng theo Giấy chứng nhận đăng ký doanh nghiệp","Bán vàng miếng cho tổ chức tín dụng được cấp phép"],c:"Điều 19 khoản 4",ex:"4. Sử dụng vàng làm phương tiện thanh toán."},
  {ch:"VI",q:"Cá nhân mang vàng khi xuất cảnh, nhập cảnh vượt mức quy định bị coi là vi phạm khi nào?",o:["Khi không có giấy phép do NHNN cấp","Trong mọi trường hợp","Khi không khai báo với hãng hàng không","Khi mang trên 1 kg"],c:"Điều 19 khoản 3",ex:"3. Mang theo vàng khi xuất cảnh, nhập cảnh của cá nhân vượt mức quy định không có giấy phép do Ngân hàng Nhà nước cấp."},
  {ch:"VI",q:"Nội dung nào thuộc chế độ báo cáo của doanh nghiệp, ngân hàng thương mại kinh doanh vàng sau sửa đổi?",o:["Tình hình mua, bán, sử dụng, tồn kho và bán vàng nguyên liệu nhập khẩu","Danh sách khách hàng mua vàng trang sức","Lương bình quân của nhân viên","Kế hoạch mở chi nhánh mới"],c:"Điều 20",ex:"… báo cáo tình hình sản xuất, mua, bán vàng miếng; tình hình xuất khẩu, nhập khẩu vàng; tình hình mua, bán, sử dụng, tồn kho vàng nguyên liệu nhập khẩu; … tình hình bán vàng nguyên liệu nhập khẩu …",am:A2},
  {ch:"VI",q:"Ai có trách nhiệm hướng dẫn và tổ chức thực hiện Nghị định về quản lý hoạt động kinh doanh vàng?",o:["Thống đốc NHNN","Bộ trưởng Bộ Công Thương","Bộ trưởng Bộ Tài chính","Chánh Thanh tra Chính phủ"],c:"Điều 23 khoản 1",ex:"Thống đốc Ngân hàng Nhà nước Việt Nam có trách nhiệm hướng dẫn và tổ chức thực hiện Nghị định này."}

  {ch:"I",q:"Thông tư quy định về tiêu hủy những loại tiền nào?",o:["Tiền giấy (cotton, polymer) và tiền kim loại không đủ tiêu chuẩn lưu thông, tiền đình chỉ lưu hành","Chỉ tiền giấy polymer không đủ tiêu chuẩn lưu thông","Tiền giả và tiền nghi giả thu giữ được","Tiền mẫu, tiền lưu niệm và tiền đình chỉ lưu hành"],c:"Điều 1",ex:"Thông tư này quy định về tiêu huỷ tiền giấy (cotton, polymer) và tiền kim loại không đủ tiêu chuẩn lưu thông, tiền đình chỉ lưu hành (sau đây gọi là tiền tiêu hủy)."},
  {ch:"I",q:"Đối tượng nào KHÔNG được liệt kê là đối tượng áp dụng của Thông tư?",o:["Các tổ chức tín dụng nước ngoài không có hiện diện tại Việt Nam","Hội đồng tiêu hủy tiền của NHNN","Hội đồng giám sát tiêu hủy tiền của NHNN","Các đơn vị trực thuộc NHNN liên quan đến tiêu hủy, giám sát tiêu hủy tiền"],c:"Điều 2",ex:"1. Hội đồng tiêu hủy … 2. Hội đồng giám sát … 3. Các đơn vị trực thuộc NHNN và các tổ chức, cá nhân có liên quan đến công tác tiêu hủy tiền, giám sát tiêu hủy tiền."},
  {ch:"I",q:"Ai trình Thống đốc phê duyệt kế hoạch tiêu hủy tiền?",o:["Cục trưởng Cục Phát hành và Kho quỹ","Chủ tịch Hội đồng giám sát","Vụ trưởng Vụ Tài chính - Kế toán","Chánh Thanh tra NHNN"],c:"Điều 3 khoản 1",ex:"… Cục trưởng Cục Phát hành và Kho quỹ trình Thống đốc Ngân hàng Nhà nước phê duyệt kế hoạch tiêu huỷ tiền, bao gồm thời gian tiêu huỷ tiền, số lượng, giá trị từng loại tiền tiêu huỷ.",am:1},
  {ch:"I",q:"Yếu tố nào KHÔNG thuộc căn cứ để lập kế hoạch tiêu hủy tiền theo Điều 3?",o:["Dự báo tốc độ tăng trưởng tín dụng","Số liệu tồn kho tiền không đủ tiêu chuẩn lưu thông, tiền đình chỉ lưu hành tại Quỹ Dự trữ phát hành","Số lượng lao động và công suất máy móc thiết bị","Định mức giao nhận, kiểm đếm, cắt hủy"],c:"Điều 3 khoản 1",ex:"Căn cứ số liệu tồn kho … tại Quỹ Dự trữ phát hành …; số lượng lao động; công suất máy móc thiết bị; định mức giao nhận, kiểm đếm, cắt huỷ …",am:1},
  {ch:"I",q:"Kế hoạch tiêu hủy tiền trình Thống đốc phê duyệt bao gồm những nội dung nào?",o:["Thời gian tiêu hủy, số lượng, giá trị từng loại tiền tiêu hủy","Danh sách nhân sự và mức bồi dưỡng","Phương án bán phế liệu và dự toán chi phí","Địa điểm tiêu hủy và thành phần Hội đồng giám sát"],c:"Điều 3 khoản 1",ex:"… kế hoạch tiêu huỷ tiền, bao gồm thời gian tiêu huỷ tiền, số lượng, giá trị từng loại tiền tiêu huỷ.",am:1},
  {ch:"I",q:"Cụm tiêu hủy phía Nam được tổ chức tại đâu?",o:["Chi cục Phát hành và Kho quỹ ở TP. Hồ Chí Minh","NHNN chi nhánh Khu vực tại TP. Hồ Chí Minh","Sở Giao dịch NHNN","Kho tiền Trung ương tại Đà Nẵng"],c:"Điều 3 khoản 2",ex:"Hội đồng tiêu huỷ tổ chức tiêu hủy tiền tại Cục Phát hành và Kho quỹ ở Hà Nội (Cụm tiêu hủy phía Bắc) và tại Chi cục Phát hành và Kho quỹ ở thành phố Hồ Chí Minh (Cụm tiêu hủy phía Nam)."},
  {ch:"I",q:"Trường hợp cần tổ chức tiêu hủy tiền tại cơ sở khác ngoài hai cụm tiêu hủy, ai quyết định?",o:["Thống đốc NHNN","Chủ tịch Hội đồng tiêu hủy","Cục trưởng Cục Phát hành và Kho quỹ","Chủ tịch Hội đồng giám sát"],c:"Điều 3 khoản 2",ex:"Trường hợp cần thiết phải tổ chức tiêu hủy tiền tại cơ sở khác do Thống đốc Ngân hàng Nhà nước quyết định."},
  {ch:"I",q:"Ai quyết định tỷ lệ kiểm đếm từng loại tiền trước khi tiêu hủy, và căn cứ vào đâu?",o:["Chủ tịch Hội đồng tiêu hủy, căn cứ kết quả thừa, thiếu qua kiểm đếm tiền tiêu hủy hằng năm","Thống đốc NHNN, căn cứ kế hoạch tiêu hủy năm","Chủ tịch Hội đồng giám sát, căn cứ kết quả kiểm kê hằng tháng","Phó Chủ tịch phụ trách cụm, căn cứ công suất máy móc"],c:"Điều 4 khoản 2",ex:"Căn cứ kết quả thừa, thiếu qua kiểm đếm tiền tiêu huỷ hằng năm, Chủ tịch Hội đồng tiêu huỷ quyết định tỷ lệ kiểm đếm từng loại tiền trước khi tiêu huỷ.",am:1},
  {ch:"I",q:"Theo nguyên tắc tiêu hủy, tiêu hủy theo số tiền nào?",o:["Số tiền thực tế đã nhận từ Kho tiền Trung ương sau khi có kết quả kiểm đếm, phân loại của Hội đồng tiêu hủy","Số tiền ghi trên lệnh điều chuyển của Cục Phát hành và Kho quỹ","Số tiền ghi trong kế hoạch tiêu hủy được Thống đốc phê duyệt","Số tiền ghi trên niêm phong của tổ chức tín dụng nộp về"],c:"Điều 4 khoản 3",ex:"Tiêu huỷ theo số tiền thực tế đã nhận từ Kho tiền Trung ương sau khi có kết quả kiểm đếm, phân loại của Hội đồng tiêu hủy."},
  {ch:"I",q:"Yêu cầu đối với tiền sau khi đã tiêu hủy thành phế liệu là gì?",o:["Phải bảo đảm không thể khôi phục để sử dụng lại như tiền","Phải được nhập lại Quỹ Dự trữ phát hành","Phải được lưu giữ tối thiểu 5 năm","Phải được chuyển giao cho Thanh tra NHNN"],c:"Điều 4 khoản 4",ex:"Tiền sau khi đã tiêu hủy thành phế liệu phải bảo đảm không thể khôi phục để sử dụng lại như tiền."},
  {ch:"I",q:"Tiền giấy được tiêu hủy bằng phương pháp nào?",o:["Hệ thống máy cắt hủy chuyên dùng","Đốt trong lò chuyên dụng","Nghiền ướt và ép kiện","Nấu chảy"],c:"Điều 5 khoản 1",ex:"Tiền tiêu hủy là tiền giấy được tiêu hủy bằng hệ thống máy cắt hủy chuyên dùng."},
  {ch:"I",q:"Tiền kim loại được tiêu hủy bằng phương pháp nào?",o:["Nấu chảy hoặc máy hủy tiền kim loại chuyên dùng","Chỉ bằng phương pháp nấu chảy","Hệ thống máy cắt hủy tiền giấy chuyên dùng","Dập biến dạng thủ công"],c:"Điều 5 khoản 2",ex:"Tiền tiêu hủy là tiền kim loại được tiêu hủy bằng phương pháp nấu chảy hoặc máy hủy tiền kim loại chuyên dùng."},

  {ch:"II",q:"Hội đồng tiêu hủy được thành lập như thế nào?",o:["Hàng năm, do Thống đốc NHNN quyết định thành lập","Mỗi đợt tiêu hủy, do Cục trưởng Cục Phát hành và Kho quỹ quyết định","5 năm một lần, do Thống đốc quyết định","Hàng năm, do Chủ tịch Hội đồng giám sát quyết định"],c:"Điều 6 khoản 1",ex:"Hàng năm, Thống đốc Ngân hàng Nhà nước quyết định thành lập Hội đồng tiêu hủy …"},
  {ch:"II",q:"Chủ tịch Hội đồng tiêu hủy là ai?",o:["Cục trưởng Cục Phát hành và Kho quỹ","Một Phó Thống đốc NHNN","Vụ trưởng Vụ Tài chính - Kế toán","Chánh Thanh tra NHNN"],c:"Điều 6 khoản 1 điểm a",ex:"a) Chủ tịch: Cục trưởng Cục Phát hành và Kho quỹ."},
  {ch:"II",q:"Phó Chủ tịch thường trực Hội đồng tiêu hủy là ai?",o:["Phó Cục trưởng Cục Phát hành và Kho quỹ trực tiếp phụ trách Cụm tiêu hủy phía Bắc","Chi cục trưởng Chi cục Phát hành và Kho quỹ tại TP. Hồ Chí Minh","Phó Vụ trưởng Vụ Tài chính - Kế toán","Phó Chánh Thanh tra NHNN"],c:"Điều 6 khoản 1 điểm b",ex:"b) 01 (một) Phó Chủ tịch thường trực: Phó Cục trưởng Cục Phát hành và Kho quỹ trực tiếp phụ trách Cụm tiêu hủy phía Bắc."},
  {ch:"II",q:"Hội đồng tiêu hủy có tổng cộng bao nhiêu Phó Chủ tịch?",o:["3","2","4","1"],c:"Điều 6 khoản 1 điểm b, c, d",ex:"01 Phó Chủ tịch thường trực (Phó Cục trưởng Cục PH&KQ); 01 Phó Chủ tịch là Phó Vụ trưởng Vụ Tài chính - Kế toán; 01 Phó Chủ tịch là Chi cục trưởng Chi cục PH&KQ tại TP. Hồ Chí Minh."},
  {ch:"II",q:"Phó Chủ tịch Hội đồng tiêu hủy đến từ Vụ Tài chính - Kế toán giữ chức vụ gì?",o:["Phó Vụ trưởng","Vụ trưởng","Trưởng phòng","Kế toán trưởng"],c:"Điều 6 khoản 1 điểm c",ex:"c) 01 (một) Phó Chủ tịch là Phó Vụ trưởng Vụ Tài chính - Kế toán."},
  {ch:"II",q:"Trong số ủy viên Hội đồng tiêu hủy, có bao nhiêu người kiêm nhiệm vụ thư ký?",o:["3 (một thư ký Hội đồng và hai thư ký tại hai cụm)","1","2 (một ở mỗi cụm)","4 (một ở mỗi tổ chuyên trách)"],c:"Điều 6 khoản 1 điểm e",ex:"Trong đó có một ủy viên kiêm thư ký Hội đồng tiêu hủy và hai ủy viên kiêm thư ký tại Cụm tiêu hủy phía Bắc và Cụm tiêu hủy phía Nam."},
  {ch:"II",q:"Tại mỗi cụm tiêu hủy, bộ phận giúp việc Hội đồng tiêu hủy được tổ chức thành bao nhiêu tổ chuyên trách?",o:["4","3","5","6"],c:"Điều 6 khoản 2",ex:"Giúp việc Hội đồng tiêu hủy gồm có các tổ chuyên trách; tại từng cụm tiêu hủy được tổ chức thành 04 (bốn) tổ."},
  {ch:"II",q:"Ai ban hành nội quy, quy chế làm việc của Hội đồng tiêu hủy?",o:["Chủ tịch Hội đồng tiêu hủy","Thống đốc NHNN","Chủ tịch Hội đồng giám sát","Phó Chủ tịch thường trực"],c:"Điều 8 khoản 2",ex:"Ban hành nội quy, quy chế làm việc của Hội đồng tiêu hủy."},
  {ch:"II",q:"Ai phê duyệt kế hoạch nhận tiền tiêu hủy từ Kho tiền Trung ương của một cụm tiêu hủy?",o:["Phó Chủ tịch phụ trách cụm tiêu hủy đó","Chủ tịch Hội đồng tiêu hủy","Thống đốc NHNN","Thủ kho tiền tiêu hủy"],c:"Điều 9 khoản 1 điểm d",ex:"Phó Chủ tịch phụ trách cụm tiêu hủy … phê duyệt kế hoạch nhận tiền tiêu hủy từ Kho tiền Trung ương của cụm tiêu hủy."},
  {ch:"II",q:"Phó Chủ tịch thường trực thay mặt Chủ tịch chỉ đạo, điều hành công việc của Hội đồng tiêu hủy khi nào?",o:["Khi được ủy quyền","Khi Chủ tịch đi công tác trên 15 ngày","Bất cứ khi nào Chủ tịch vắng mặt","Khi được Hội đồng giám sát chấp thuận"],c:"Điều 9 khoản 1 điểm c",ex:"Phó Chủ tịch thường trực thay mặt Chủ tịch Hội đồng tiêu hủy chịu trách nhiệm chỉ đạo, điều hành công việc của Hội đồng tiêu hủy khi được ủy quyền."},
  {ch:"II",q:"“Tổ 1” trong các tổ chuyên trách là tổ nào?",o:["Tổ giao nhận và bảo quản tiền tiêu hủy","Tổ kiểm đếm tiền tiêu hủy","Tổ cắt hủy tiền","Tổ tổng hợp"],c:"Điều 10 khoản 1",ex:"Tổ giao nhận và bảo quản tiền tiêu huỷ (sau đây gọi là Tổ 1) …"},
  {ch:"II",q:"Tổ nào có nhiệm vụ nhập kho tiền đủ tiêu chuẩn lưu thông được chọn ra từ kiểm đếm tiền tiêu hủy?",o:["Tổ 1 – Tổ giao nhận và bảo quản","Tổ 2 – Tổ kiểm đếm","Tổ 3 – Tổ cắt hủy","Tổ 4 – Tổ tổng hợp"],c:"Điều 10 khoản 1",ex:"Tổ 1: … bảo quản tiền do các tổ chuyên trách gửi lại; nhập kho tiền đủ tiêu chuẩn lưu thông chọn ra từ kiểm đếm tiền tiêu hủy."},
  {ch:"II",q:"Tổ 2 kiểm đếm tờ (miếng) đối với những bó (túi) nào phát hiện trong quá trình giao nhận?",o:["Bó (túi) thừa hoặc thiếu thếp, niêm phong, đóng gói không đúng quy cách","Mọi bó (túi) nhận từ Kho tiền Trung ương","Chỉ bó (túi) có mệnh giá từ 100.000 đồng trở lên","Bó (túi) do Hội đồng giám sát chỉ định"],c:"Điều 10 khoản 2",ex:"… kiểm đếm tờ (miếng) trong trường hợp bó (túi) tiền thừa hoặc thiếu thếp, các bó (túi) tiền niêm phong, đóng gói không đúng quy cách phát hiện trong quá trình giao nhận."},
  {ch:"II",q:"Tổ 4 (Tổ tổng hợp) KHÔNG có nhiệm vụ nào sau đây?",o:["Cắt hủy tiền và thu hồi phế liệu","Thực hiện công việc hành chính, kế toán, thống kê","Theo dõi việc nhập, xuất phế liệu tiền tiêu hủy","Đề xuất nhu cầu mua sắm vật tư, vật liệu phục vụ tiêu hủy"],c:"Điều 10 khoản 3, 4",ex:"Tổ 3 thực hiện cắt huỷ … và thu hồi phế liệu. Tổ 4: Thực hiện các công việc hành chính, kế toán, thống kê; theo dõi việc nhập, xuất phế liệu tiền tiêu hủy; đề xuất nhu cầu mua sắm vật tư, vật liệu."},
  {ch:"II",q:"Tổ trưởng và Tổ phó của mỗi tổ chuyên trách do ai xem xét, quyết định?",o:["Phó Chủ tịch phụ trách cụm tiêu hủy","Chủ tịch Hội đồng tiêu hủy","Vụ trưởng Vụ Tổ chức cán bộ","Thống đốc NHNN"],c:"Điều 10 khoản 5",ex:"Mỗi tổ chuyên trách có Tổ trưởng và Tổ phó giúp việc do Phó Chủ tịch phụ trách cụm tiêu hủy xem xét, quyết định."},
  {ch:"II",q:"Khi phát hiện hành vi tham ô, lấy cắp tài sản, Tổ trưởng tổ chuyên trách phải làm gì?",o:["Phối hợp với công chức giám sát lập biên bản, báo cáo Hội đồng tiêu hủy và Hội đồng giám sát","Báo ngay cho cơ quan công an và tạm dừng tiêu hủy","Tự lập biên bản và gửi Vụ Tổ chức cán bộ","Báo cáo trực tiếp Thống đốc NHNN"],c:"Điều 11 khoản 3",ex:"Khi phát hiện các hành vi tham ô, lợi dụng lấy cắp tài sản, Tổ trưởng phối hợp với công chức giám sát lập biên bản báo cáo Hội đồng tiêu hủy và Hội đồng giám sát để xử lý kịp thời."},
  {ch:"II",q:"Để trưng tập công chức, người lao động từ các đơn vị thuộc NHNN tham gia tiêu hủy tiền, Cục Phát hành và Kho quỹ phối hợp với đơn vị nào trình Thống đốc?",o:["Vụ Tổ chức cán bộ","Vụ Tài chính - Kế toán","Thanh tra NHNN","Văn phòng NHNN"],c:"Điều 12 khoản 2; Điều 30",ex:"Trường hợp cần thiết, Cục Phát hành và Kho quỹ phối hợp với Vụ Tổ chức cán bộ trình Thống đốc Ngân hàng Nhà nước trưng tập công chức, người lao động …"},

  {ch:"III",q:"Tham gia quản lý kho tiền tiêu hủy tại mỗi cụm gồm những thành viên nào?",o:["Ủy viên Hội đồng tiêu hủy, nhân viên kế toán kho tiền tiêu hủy và thủ kho tiền tiêu hủy","Chủ tịch Hội đồng tiêu hủy, Tổ trưởng Tổ 1 và thủ kho","Phó Chủ tịch phụ trách cụm, công chức giám sát và thủ kho","Tổ trưởng Tổ 1, Tổ trưởng Tổ 2 và Tổ trưởng Tổ 3"],c:"Điều 13 khoản 2 điểm a",ex:"Tham gia quản lý kho tiền tiêu hủy tại mỗi cụm tiêu hủy gồm 03 (ba) thành viên: Ủy viên Hội đồng tiêu hủy, nhân viên thực hiện nhiệm vụ kế toán kho tiền tiêu hủy và thủ kho tiền tiêu hủy."},
  {ch:"III",q:"Thành viên tham gia quản lý kho tiền tiêu hủy do ai xem xét, quyết định?",o:["Thống đốc NHNN","Chủ tịch Hội đồng tiêu hủy","Phó Chủ tịch phụ trách cụm tiêu hủy","Cục trưởng Cục Phát hành và Kho quỹ"],c:"Điều 13 khoản 2 điểm b",ex:"Thành viên tham gia quản lý kho tiền tiêu hủy do Thống đốc Ngân hàng Nhà nước xem xét, quyết định."},
  {ch:"III",q:"Thủ kho tiền tiêu hủy giữ chìa khóa nào của cửa kho tiền?",o:["Một ổ khóa của lớp cánh trong cửa kho tiền","Một ổ khóa của lớp cánh ngoài cửa kho tiền","Toàn bộ chìa khóa dự phòng","Không giữ chìa khóa cửa kho"],c:"Điều 13 khoản 2 điểm c (iii)",ex:"Thủ kho tiền tiêu hủy … quản lý và giữ chìa khóa một ổ khóa của lớp cánh trong cửa kho tiền."},
  {ch:"III",q:"Thành viên nào có nhiệm vụ kiểm tra, đối chiếu số liệu giữa sổ kế toán và sổ quỹ đảm bảo khớp đúng?",o:["Nhân viên thực hiện nhiệm vụ kế toán kho tiền tiêu hủy","Ủy viên Hội đồng tiêu hủy","Thủ kho tiền tiêu hủy","Tổ trưởng Tổ 4"],c:"Điều 13 khoản 2 điểm c (ii)",ex:"Nhân viên thực hiện nhiệm vụ kế toán kho tiền tiêu hủy … kiểm tra, đối chiếu số liệu giữa sổ kế toán và sổ quỹ đảm bảo khớp đúng."},
  {ch:"III",q:"Thành viên quản lý kho tiền tiêu hủy tại Cụm phía Nam nghỉ dưới 15 ngày làm việc thì ai quyết định cử người thay thế?",o:["Phó Chủ tịch phụ trách Cụm tiêu hủy phía Nam","Chủ tịch Hội đồng tiêu hủy","Thống đốc NHNN","Chi cục trưởng kiêm Chủ tịch Hội đồng giám sát"],c:"Điều 13 khoản 3",ex:"… ít hơn 15 ngày làm việc, Chủ tịch Hội đồng tiêu hủy (đối với Cụm tiêu hủy phía Bắc) và Phó Chủ tịch phụ trách Cụm tiêu hủy phía Nam (đối với Cụm tiêu hủy phía Nam) xem xét, quyết định cử người thay thế."},
  {ch:"III",q:"Thành viên quản lý kho tiền tiêu hủy nghỉ từ 15 ngày làm việc trở lên thì ai quyết định người thay thế?",o:["Thống đốc NHNN","Chủ tịch Hội đồng tiêu hủy","Phó Chủ tịch phụ trách cụm","Vụ trưởng Vụ Tổ chức cán bộ"],c:"Điều 13 khoản 3",ex:"Trường hợp nghỉ từ 15 ngày làm việc trở lên do Thống đốc Ngân hàng Nhà nước xem xét, quyết định."},
  {ch:"III",q:"Đối với Cụm tiêu hủy phía Nam, đơn vị nào lập phiếu xuất kho tiền tiêu hủy từ Kho tiền Trung ương?",o:["Phòng Kế toán - Tài vụ thuộc Chi cục Phát hành và Kho quỹ","Vụ Tài chính - Kế toán","Cục Phát hành và Kho quỹ","NHNN chi nhánh Khu vực tại TP. Hồ Chí Minh"],c:"Điều 14 khoản 1",ex:"… Cục Phát hành và Kho quỹ lập lệnh điều chuyển để Vụ Tài chính - Kế toán (đối với Cụm tiêu hủy phía Bắc) và Phòng Kế toán - Tài vụ thuộc Chi cục Phát hành và Kho quỹ (đối với Cụm tiêu hủy phía Nam) lập phiếu xuất kho …"},
  {ch:"III",q:"Đơn vị nào lập lệnh điều chuyển tiền tiêu hủy từ Kho tiền Trung ương?",o:["Cục Phát hành và Kho quỹ","Vụ Tài chính - Kế toán","Hội đồng tiêu hủy","Thanh tra NHNN"],c:"Điều 14 khoản 1",ex:"… Cục Phát hành và Kho quỹ lập lệnh điều chuyển …"},
  {ch:"III",q:"Khi thủ kho tiền tiêu hủy nhận tiền từ Kho tiền Trung ương, việc nhận phải có sự giám sát của ai?",o:["Công chức kiểm soát nội bộ Cục Phát hành và Kho quỹ, Chi cục Phát hành và Kho quỹ","Thanh tra viên NHNN","Đại diện Vụ Tài chính - Kế toán","Chủ tịch Hội đồng tiêu hủy"],c:"Điều 15 khoản 1",ex:"Thủ kho tiền tiêu huỷ tổ chức nhận tiền … theo bao (thùng) nguyên niêm phong kẹp chì … có sự giám sát của công chức kiểm soát nội bộ Cục Phát hành và Kho quỹ, Chi cục Phát hành và Kho quỹ.",am:1},
  {ch:"III",q:"Số tiền không thuộc diện kiểm đếm tờ (miếng) theo tỷ lệ được xuất giao cho tổ nào?",o:["Tổ 3 để cắt hủy","Tổ 2 để kiểm đếm theo bó","Tổ 4 để hạch toán","Giữ lại tại kho tiền tiêu hủy đến cuối đợt"],c:"Điều 15 khoản 3",ex:"… Hội đồng tiêu huỷ thực hiện lấy ngẫu nhiên số tiền theo tỷ lệ kiểm đếm … để Tổ 1 xuất giao cho Tổ 2 kiểm đếm tờ (miếng); số tiền còn lại không phải kiểm đếm tờ (miếng) được xuất giao cho Tổ 3 để cắt hủy."},
  {ch:"III",q:"Số tiền đưa vào kiểm đếm tờ (miếng) được chọn theo cách nào?",o:["Lấy ngẫu nhiên theo tỷ lệ kiểm đếm từng loại tiền do Chủ tịch Hội đồng tiêu hủy phê duyệt","Chọn các bao có niêm phong lâu nhất","Kiểm đếm toàn bộ 100% số tiền nhận về","Do Hội đồng giám sát chỉ định từng bao"],c:"Điều 15 khoản 3",ex:"Hội đồng tiêu huỷ thực hiện lấy ngẫu nhiên số tiền theo tỷ lệ kiểm đếm từng loại tiền do Chủ tịch Hội đồng tiêu hủy phê duyệt …"},
  {ch:"III",q:"Tổ trưởng Tổ 2 giao tiền cho từng kiểm ngân theo bó tiền giấy đủ bao nhiêu thếp?",o:["10 thếp","5 thếp","20 thếp","100 thếp"],c:"Điều 16 khoản 2 điểm a",ex:"Giao nhận theo bó đủ 10 thếp (tiền giấy), túi (tiền kim loại) nguyên niêm phong …",am:1},
  {ch:"III",q:"Việc Tổ trưởng Tổ 2 giao tiền cho từng kiểm ngân phải có sự giám sát của ai?",o:["Hội đồng giám sát","Phó Chủ tịch phụ trách cụm","Thủ kho tiền tiêu hủy","Tổ trưởng Tổ 1"],c:"Điều 16 khoản 2",ex:"Tổ trưởng Tổ 2 nhận theo bao (thùng) nguyên niêm phong kẹp chì … và tổ chức giao cho từng kiểm ngân có sự giám sát của Hội đồng giám sát.",am:1},
  {ch:"III",q:"Kiểm ngân kiểm đếm thấy bó (túi) tiền đủ số lượng tờ (miếng), đúng loại tiền ghi trên niêm phong thì xử lý thế nào?",o:["Hủy ngay giấy niêm phong và đóng bó (túi), niêm phong mới","Giữ nguyên niêm phong cũ và chuyển Tổ 3","Gửi lại kho tiền tiêu hủy để kiểm kê","Lập biên bản gửi tổ chức tín dụng đã niêm phong"],c:"Điều 16 khoản 3",ex:"Nếu bó (túi) tiền đủ số lượng tờ (miếng), đúng loại tiền ghi trên niêm phong thì hủy ngay giấy niêm phong và thực hiện đóng bó (túi), niêm phong mới.",am:1},
  {ch:"III",q:"Quy cách đóng bó tiền giấy sau kiểm đếm: buộc dây như thế nào?",o:["2 vòng ngang, 1 vòng dọc","1 vòng ngang, 1 vòng dọc","2 vòng ngang, 2 vòng dọc","3 vòng ngang"],c:"Điều 16 khoản 4 điểm a",ex:"… xếp 10 (mười) thếp tiền cùng loại thành 01 (một) bó, dùng dây (sợi se, nilon...) buộc chặt 02 (hai) vòng ngang, 01 (một) vòng dọc bó tiền, dán niêm phong lên mặt có nút buộc bó tiền."},
  {ch:"III",q:"Tiền giấy biến dạng không thể đóng bó thông thường thì đóng gói thế nào?",o:["Đóng vào 01 túi vải đủ 1.000 tờ, buộc thắt chặt miệng túi, dán niêm phong sát nút buộc","Đóng vào túi nilon 500 tờ","Gói giấy kraft theo thếp 100 tờ","Để rời trong thùng tôn có khóa"],c:"Điều 16 khoản 4 điểm a",ex:"Đối với tiền giấy biến dạng không thể đóng bó như trên: đóng vào 01 (một) túi vải đủ 1.000 tờ, dùng dây … buộc thắt chặt miệng túi, dán niêm phong sát nút buộc miệng túi tiền."},
  {ch:"III",q:"Mỗi túi vải tiền kim loại sau kiểm đếm phải đủ bao nhiêu miếng?",o:["1.000 miếng","500 miếng","2.000 miếng","100 miếng"],c:"Điều 16 khoản 4 điểm b",ex:"Đối với tiền kim loại, đóng vào túi vải đủ 1.000 miếng …"},
  {ch:"III",q:"Một thùng tiền kim loại mệnh giá 5.000 đồng chứa bao nhiêu túi?",o:["50 túi","75 túi","100 túi","40 túi"],c:"Điều 16 khoản 4 điểm b (i)",ex:"01 thùng mệnh giá 5.000 đồng: 50 túi."},
  {ch:"III",q:"Một thùng tiền kim loại mệnh giá 2.000 đồng, 1.000 đồng hoặc 500 đồng chứa bao nhiêu túi?",o:["75 túi","50 túi","100 túi","60 túi"],c:"Điều 16 khoản 4 điểm b (ii)",ex:"01 thùng mệnh giá 2.000 đồng, 1.000 đồng, 500 đồng: 75 túi."},
  {ch:"III",q:"Một thùng tiền kim loại mệnh giá 200 đồng chứa bao nhiêu túi?",o:["100 túi","75 túi","50 túi","150 túi"],c:"Điều 16 khoản 4 điểm b (iii)",ex:"01 thùng mệnh giá 200 đồng: 100 túi."},
  {ch:"III",q:"Thông tin nào KHÔNG thuộc các yếu tố bắt buộc ghi trên niêm phong bao (thùng), bó (túi) tiền sau kiểm đếm?",o:["Số seri của tờ tiền đầu tiên trong bó","Ngày, tháng, năm kiểm đếm và loại tiền","Số tờ (miếng) và thành tiền","Họ tên và chữ ký người kiểm đếm"],c:"Điều 16 khoản 4 điểm c",ex:"Trên niêm phong bao (thùng), bó (túi) tiền ghi đầy đủ các yếu tố ngày, tháng, năm kiểm đếm, loại tiền, số tờ (miếng), thành tiền, họ tên và chữ ký người kiểm đếm.",am:1},
  {ch:"III",q:"Số tiền tạm ứng (để bù vào bó thiếu tờ) còn lại được xử lý thế nào?",o:["Tiêu hủy vào ngày cuối cùng khi tiêu hủy loại tiền cùng mệnh giá","Nhập Quỹ Dự trữ phát hành vào cuối năm","Hoàn trả Kho tiền Trung ương ngay trong ngày","Chuyển cho Tổ 4 hạch toán thu nhập"],c:"Điều 16 khoản 6",ex:"Số tiền tạm ứng còn lại được tiêu huỷ vào ngày cuối cùng khi tiêu huỷ loại tiền cùng mệnh giá."},
  {ch:"III",q:"Trong giờ nghỉ trưa, cửa phòng kiểm đếm tiền được khóa và niêm phong với chữ ký của ai?",o:["Tổ trưởng Tổ 2 và công chức giám sát của Hội đồng giám sát","Thủ kho và kế toán kho tiền tiêu hủy","Phó Chủ tịch phụ trách cụm và Tổ trưởng Tổ 2","Kiểm ngân ra sau cùng"],c:"Điều 16 khoản 7",ex:"Cửa phòng kiểm đếm tiền phải được khóa và niêm phong có chữ ký của Tổ trưởng Tổ 2 và công chức giám sát của Hội đồng giám sát."},
  {ch:"III",q:"Cuối ngày làm việc, biên bản thừa, thiếu trong các bó (túi) tiền tiêu hủy được lập và tổng hợp theo tiêu chí nào?",o:["Theo từng NHNN chi nhánh Khu vực, Sở Giao dịch NHNN, từng tổ chức tín dụng, Kho bạc Nhà nước trên địa bàn","Theo từng kiểm ngân","Theo từng mệnh giá tiền","Theo từng ca làm việc"],c:"Điều 16 khoản 8 điểm b",ex:"Lập biên bản xác nhận và tổng hợp tiền thừa, thiếu trong các bó (túi) tiền tiêu hủy theo từng Ngân hàng Nhà nước chi nhánh Khu vực, Sở Giao dịch NHNN, từng tổ chức tín dụng, Kho bạc Nhà nước trên địa bàn …",am:1},
  {ch:"III",q:"Cuối mỗi ngày, ai lập Biên bản xác nhận kết quả tiêu hủy hoàn toàn?",o:["Tổ trưởng Tổ 3, có ký xác nhận của Tổ trưởng Tổ giám sát cắt hủy tiền","Thủ kho tiền tiêu hủy","Phó Chủ tịch phụ trách cụm","Tổ trưởng Tổ 4"],c:"Điều 17 khoản 4",ex:"Cuối mỗi ngày làm việc, Tổ trưởng Tổ 3 lập Biên bản xác nhận kết quả tiêu hủy hoàn toàn, có ký xác nhận của Tổ trưởng Tổ giám sát cắt huỷ tiền."},
  {ch:"III",q:"Tổ trưởng Tổ 3 nhận tiền để cắt hủy từ những tổ nào?",o:["Tổ 1 và Tổ 2","Chỉ Tổ 1","Chỉ Tổ 2","Tổ 2 và Tổ 4"],c:"Điều 17 khoản 1",ex:"Căn cứ chứng từ xuất kho tiền tiêu hủy, Tổ trưởng Tổ 3 tổ chức thực hiện nhận tiền từ Tổ 1 và Tổ 2 theo phương thức giao nhận bó (túi) nguyên niêm phong …",am:1},
  {ch:"III",q:"Trong giờ nghỉ trưa, ai là người ra sau cùng khóa và niêm phong cửa nơi giao nhận, kiểm đếm, cắt hủy?",o:["Tổ trưởng","Công chức giám sát","Thủ kho","Nhân viên bảo vệ"],c:"Điều 18 khoản 1",ex:"… trong giờ giải lao, giờ nghỉ trưa công chức, người lao động không được ở lại nơi làm việc, Tổ trưởng là người ra sau cùng khoá và niêm phong cửa …"},
  {ch:"III",q:"Người không có nhiệm vụ tiêu hủy tiền muốn vào kho tiền tiêu hủy, nơi kiểm đếm, cắt hủy cần điều kiện gì?",o:["Được Phó Chủ tịch phụ trách cụm tiêu hủy cho phép bằng văn bản","Được Tổ trưởng cho phép bằng lời","Xuất trình thẻ ngành NHNN","Có công chức giám sát đi cùng"],c:"Điều 18 khoản 3",ex:"Đối với những trường hợp không có nhiệm vụ thực hiện công tác tiêu hủy tiền, khi cần vào, ra … phải được sự cho phép bằng văn bản của Phó Chủ tịch phụ trách cụm tiêu hủy."},
  {ch:"III",q:"Vật dụng nào bị cấm mang vào kho tiền tiêu hủy, nơi giao nhận, kiểm đếm và cắt hủy tiền?",o:["Thiết bị liên lạc, ghi hình, cặp, túi xách, tiền mặt","Thẻ nhân viên do Hội đồng cấp","Trang phục do Hội đồng tiêu hủy và Hội đồng giám sát trang cấp","Sổ theo dõi giao nhận nội bộ"],c:"Điều 18 khoản 3",ex:"… phải đeo thẻ, mặc trang phục do Hội đồng tiêu huỷ và Hội đồng giám sát trang cấp; không được mang thiết bị liên lạc, ghi hình, cặp, túi xách, tiền mặt, chất dễ cháy, nổ trái quy định vào nơi làm việc."},

  {ch:"IV",q:"Định kỳ hàng tháng, Hội đồng tiêu hủy gửi bảng tổng hợp thừa, thiếu cho đơn vị nào để làm thủ tục báo Có hoặc báo Nợ?",o:["Vụ Tài chính - Kế toán","Cục Phát hành và Kho quỹ","Thanh tra NHNN","Kho bạc Nhà nước"],c:"Điều 19 khoản 2",ex:"… gửi Vụ Tài chính - Kế toán bảng tổng hợp số tiền thừa, thiếu, xác định số tiền chênh lệch thừa hoặc chênh lệch thiếu để làm thủ tục báo Có hoặc báo Nợ cho từng NHNN chi nhánh Khu vực, Sở Giao dịch NHNN.",am:1},
  {ch:"IV",q:"Phát hiện bó (túi) thừa hoặc thiếu thếp trong quá trình giao nhận thì xử lý thế nào?",o:["Hai bên lập biên bản tại chỗ dưới sự giám sát của công chức giám sát và giao sang Tổ 2 kiểm đếm tờ (miếng)","Trả lại Kho tiền Trung ương","Chuyển thẳng sang Tổ 3 cắt hủy","Niêm phong lại và báo Thống đốc"],c:"Điều 19 khoản 1",ex:"Trường hợp phát hiện bó (túi) tiền thừa hoặc thiếu thếp … hai bên giao nhận lập biên bản tại chỗ dưới sự giám sát của công chức giám sát và giao sang Tổ 2 để kiểm đếm tờ (miếng) …"},
  {ch:"IV",q:"Ai quyết định thời điểm tiêu hủy trong năm đối với tiền lẫn loại không đủ tiêu chuẩn lưu thông, tiền đình chỉ lưu hành và tiền giả phát hiện qua kiểm đếm?",o:["Phó Chủ tịch phụ trách cụm tiêu hủy","Chủ tịch Hội đồng tiêu hủy","Thống đốc NHNN","Chủ tịch Hội đồng giám sát"],c:"Điều 20 khoản 1",ex:"Đối với tiền lẫn loại không đủ tiêu chuẩn lưu thông, tiền đình chỉ lưu hành và tiền giả phát hiện qua kiểm đếm, Phó Chủ tịch phụ trách cụm tiêu huỷ quyết định thời điểm tiêu huỷ trong năm.",am:1},
  {ch:"IV",q:"Tiền đủ tiêu chuẩn lưu thông phát hiện qua kiểm đếm được xử lý thế nào?",o:["Nhập Quỹ dự trữ phát hành tại Kho tiền Trung ương vào cuối đợt tiêu hủy","Tiêu hủy cùng đợt","Trả lại tổ chức tín dụng đã nộp","Nhập Quỹ nghiệp vụ phát hành của NHNN chi nhánh Khu vực"],c:"Điều 20 khoản 2",ex:"Đối với tiền đủ tiêu chuẩn lưu thông phát hiện qua kiểm đếm được nhập Quỹ dự trữ phát hành tại Kho tiền Trung ương vào cuối đợt tiêu hủy."},
  {ch:"IV",q:"Tiền tiêu hủy bảo quản trong kho được kiểm kê định kỳ như thế nào?",o:["Mỗi tháng 01 lần, vào cuối ngày làm việc cuối cùng của tháng","Mỗi quý 01 lần, vào ngày đầu quý","Mỗi tuần 01 lần, vào chiều thứ Sáu","Mỗi đợt tiêu hủy 01 lần"],c:"Điều 21 khoản 1",ex:"Tiền tiêu hủy bảo quản trong kho được kiểm kê định kỳ mỗi tháng 01 (một) lần vào thời điểm cuối ngày làm việc cuối cùng của tháng.",am:1},
  {ch:"IV",q:"Khi Phó Chủ tịch phụ trách cụm vắng mặt, việc kiểm kê kho tiền tiêu hủy được ủy quyền cho ai?",o:["Một ủy viên Hội đồng tiêu hủy không phải là ủy viên quản lý kho tiền tiêu hủy","Ủy viên quản lý kho tiền tiêu hủy","Thủ kho tiền tiêu hủy","Trưởng phòng Tiêu hủy tiền"],c:"Điều 21 khoản 1",ex:"Trường hợp Phó Chủ tịch phụ trách cụm tiêu huỷ vắng mặt thì được uỷ quyền việc kiểm kê cho một uỷ viên Hội đồng tiêu huỷ (không phải là uỷ viên quản lý kho tiền tiêu huỷ).",am:1},
  {ch:"IV",q:"Biên bản kiểm kê tiền tiêu hủy được lập thành mấy bản và phân phối thế nào?",o:["03 bản: Hội đồng tiêu hủy giữ 02 bản, 01 bản gửi Hội đồng giám sát","02 bản: mỗi Hội đồng giữ 01 bản","04 bản: thêm 01 bản gửi Vụ Tài chính - Kế toán và 01 bản gửi Cục PH&KQ","05 bản như biên bản kết quả cuối năm"],c:"Điều 21 khoản 3",ex:"Biên bản kiểm kê tiền tiêu huỷ được lập thành 03 (ba) bản: Hội đồng tiêu hủy giữ 02 (hai) bản, 01 (một) bản gửi Hội đồng giám sát.",am:1},
  {ch:"IV",q:"Hằng năm, Cục Phát hành và Kho quỹ, Chi cục Phát hành và Kho quỹ gửi dự toán thu, chi phục vụ tiêu hủy tiền cho đơn vị nào?",o:["Vụ Tài chính - Kế toán","Thống đốc NHNN","Hội đồng giám sát","Vụ Tổ chức cán bộ"],c:"Điều 22 khoản 1",ex:"Hàng năm, Cục Phát hành và Kho quỹ, Chi cục Phát hành và Kho quỹ tổng hợp, lập dự toán thu, chi phục vụ tiêu hủy tiền gửi Vụ Tài chính - Kế toán theo quy định."},
  {ch:"IV",q:"Tổ trưởng Tổ 2, Tổ 3 tổng hợp báo cáo kết quả kiểm đếm, cắt hủy theo những kỳ nào?",o:["Hằng tháng, 6 tháng, đợt tiêu hủy và hằng năm","Hằng ngày và hằng tuần","Hằng quý và hằng năm","Chỉ khi kết thúc đợt tiêu hủy"],c:"Điều 23 khoản 3",ex:"… tổng hợp báo cáo kết quả kiểm đếm, kết quả cắt huỷ hằng tháng, 6 tháng, đợt tiêu huỷ và hằng năm.",am:1},
  {ch:"IV",q:"Hằng tháng, các cụm tiêu hủy tổng hợp số liệu, kết quả tiêu hủy tiền và báo cáo ai?",o:["Báo cáo Chủ tịch Hội đồng tiêu hủy và gửi Hội đồng giám sát","Báo cáo Thống đốc NHNN","Gửi Vụ Tài chính - Kế toán","Gửi Thanh tra NHNN"],c:"Điều 24 khoản 1",ex:"Hằng tháng, các cụm tiêu huỷ tổng hợp số liệu về tiêu huỷ tiền, kết quả tiêu huỷ tiền báo cáo Chủ tịch Hội đồng tiêu huỷ và gửi Hội đồng giám sát.",am:1},
  {ch:"IV",q:"Biên bản kết quả tiêu hủy hoàn toàn khi kết thúc năm được lập thành mấy bản?",o:["05 bản","03 bản","04 bản","06 bản"],c:"Điều 24 khoản 2",ex:"Biên bản được lập thành 05 (năm) bản: 01 bản gửi Vụ Tài chính - Kế toán, 02 bản gửi Cục Phát hành và Kho quỹ, 01 bản gửi Hội đồng giám sát, 01 bản lưu tại cụm tiêu hủy."},
  {ch:"IV",q:"Trong biên bản kết quả tiêu hủy hoàn toàn cuối năm, đơn vị nào nhận 02 bản?",o:["Cục Phát hành và Kho quỹ","Vụ Tài chính - Kế toán","Hội đồng giám sát","Cụm tiêu hủy lưu"],c:"Điều 24 khoản 2",ex:"… 02 (hai) bản gửi Cục Phát hành và Kho quỹ …"},
  {ch:"IV",q:"Báo cáo sơ kết, tổng kết năm công tác tiêu hủy tiền trình Thống đốc do ai chủ trì?",o:["Hội đồng tiêu hủy chủ trì, phối hợp với Hội đồng giám sát","Hội đồng giám sát chủ trì","Vụ Tài chính - Kế toán chủ trì","Thanh tra NHNN chủ trì"],c:"Điều 24 khoản 3",ex:"Hội đồng tiêu huỷ chủ trì phối hợp với Hội đồng giám sát thực hiện báo cáo sơ kết, tổng kết năm công tác tiêu huỷ tiền và giám sát tiêu huỷ tiền trình Thống đốc …",am:1},

  {ch:"V",q:"Cá nhân tham gia tiêu hủy tiền tham ô, lợi dụng lấy cắp tài sản phải chịu trách nhiệm gì?",o:["Bồi thường 100% giá trị tài sản thiếu và buộc thôi việc hoặc bị truy cứu trách nhiệm hình sự","Bồi thường 50% giá trị và bị khiển trách","Bồi thường 100% giá trị và bị hạ bậc lương","Chỉ bị truy cứu trách nhiệm hình sự"],c:"Điều 27 khoản 3",ex:"… nếu tham ô, lợi dụng lấy cắp tài sản thì phải bồi thường 100% giá trị tài sản thiếu và buộc thôi việc hoặc bị truy cứu trách nhiệm hình sự theo quy định của pháp luật."},

vbhn117:{
  sum:"Hai lần sửa đổi 2025 và 2026 chuyển hướng quản lý thị trường vàng từ độc quyền nhà nước sang thị trường hóa có kiểm soát. Văn bản cho thêm chủ thể sản xuất vàng miếng, bỏ điều kiện với vàng trang sức và tăng yêu cầu về dữ liệu giao dịch. Tuy vậy, ngưỡng gia nhập rất cao, một số điều khoản cũ chưa được dọn lại và thẩm quyền thanh tra còn phân tán.",

  {t:"plus",title:"Xóa thế độc quyền sản xuất vàng miếng",cite:"Điều 3 khoản 2; Điều 11a; Điều 16 khoản 1",body:"Định nghĩa vàng miếng không còn gắn với một thương hiệu duy nhất. Doanh nghiệp và ngân hàng thương mại đủ điều kiện được cấp Giấy phép sản xuất, và NHNN được giao xây dựng chiến lược thị trường vàng “theo hướng thị trường hóa”. Nguồn cung tăng là điều kiện để thu hẹp chênh lệch giữa giá trong nước và giá thế giới.",rec:"Đặt chỉ tiêu theo dõi công khai, ví dụ chênh lệch giá vàng miếng trong nước so với thế giới, để đánh giá hiệu quả chính sách sau 1–2 năm."},
  {t:"plus",title:"Cắt giảm điều kiện với vàng trang sức, mỹ nghệ",cite:"Điều 4 khoản 7; bãi bỏ Điều 5–9",body:"Hoạt động sản xuất, gia công, mua bán vàng trang sức không còn là ngành nghề kinh doanh có điều kiện. Quản lý chuyển sang các luật chuyên ngành về chất lượng, đo lường, nhãn hàng hóa, thuế và phòng, chống rửa tiền. Cách làm này giảm thủ tục cho số đông cơ sở nhỏ mà vẫn giữ công cụ kiểm soát."},

  {t:"issue",title:"Ngưỡng vốn rất cao, dễ chuyển từ độc quyền sang độc quyền nhóm",cite:"Điều 11a khoản 1 điểm b, khoản 2 điểm b",body:"Ngân hàng thương mại cần vốn điều lệ từ 50.000 tỷ đồng, doanh nghiệp từ 1.000 tỷ đồng mới được sản xuất vàng miếng. Chỉ một số ít chủ thể lớn đáp ứng được. Văn bản không nêu cơ sở định lượng cho các mức này. Ngưỡng cho ngân hàng gấp 50 lần ngưỡng cho doanh nghiệp, dù cùng thực hiện một hoạt động sản xuất, và văn bản không giải thích sự chênh lệch này.",rec:"Công bố căn cứ xác định ngưỡng vốn. Cân nhắc bổ sung tiêu chí năng lực kỹ thuật (dây chuyền, kiểm định hàm lượng) thay vì chỉ dựa vào vốn điều lệ."},

  {t:"gap",title:"Ngưỡng 5 triệu đồng/ngày thấp so với giá trị giao dịch vàng thông thường",cite:"Điều 4 khoản 10",body:"Mọi giao dịch mua, bán vàng từ 05 triệu đồng/ngày của một khách hàng phải thanh toán không dùng tiền mặt. Ngưỡng này áp dụng cho cả vàng trang sức, tác động lớn đến người cao tuổi và khu vực nông thôn chưa quen thanh toán điện tử. Văn bản không nói cách kiểm soát khi một người chia nhỏ giao dịch qua nhiều cửa hàng trong ngày.",rec:"Cân nhắc ngưỡng riêng cho vàng trang sức, hoặc điều chỉnh ngưỡng định kỳ theo giá vàng. Làm rõ trách nhiệm của bên bán khi giao dịch bị chia nhỏ."},

  {t:"gap",title:"Tiêu chí mạng lưới theo số tỉnh sau khi sắp xếp đơn vị hành chính",cite:"Điều 11 khoản 1 điểm đ, khoản 2 điểm c",body:"Điều kiện cấp Giấy phép kinh doanh mua, bán vàng miếng (mạng lưới từ 3 tỉnh với doanh nghiệp, từ 5 tỉnh với tổ chức tín dụng) giữ nguyên từ năm 2012. Số lượng và quy mô đơn vị hành chính cấp tỉnh đã thay đổi, nên cùng một con số giờ phản ánh độ phủ thị trường khác trước. Các mức vốn 100 tỷ và thuế 500 triệu đồng/năm cũng chưa được cập nhật.",rec:"Rà soát lại toàn bộ Điều 11 cho phù hợp với Điều 11a và với địa giới hành chính hiện hành."},
  {t:"gap",title:"Chưa có tiêu chuẩn hàm lượng thống nhất cho vàng miếng",cite:"Điều 12 khoản 3 điểm a; Điều 14 khoản 10 điểm a; Điều 17 khoản 3",body:"Đơn vị sản xuất tự công bố tiêu chuẩn, khối lượng, hàm lượng. Nghị định chỉ đặt ngưỡng 99,5% cho vàng nhập khẩu. Khi có nhiều thương hiệu cùng sản xuất, nếu thiếu tiêu chuẩn quốc gia bắt buộc thì vàng miếng khó thay thế cho nhau, người mua khó so sánh giá, và khó mua đi bán lại chéo giữa các thương hiệu.",rec:"Sớm ban hành tiêu chuẩn quốc gia bắt buộc cho vàng miếng (hàm lượng, khối lượng chuẩn, dấu hiệu nhận biết) như Điều 17 khoản 3 đã giao Bộ Khoa học và Công nghệ."},
  {t:"issue",title:"Thẩm quyền thanh tra, kiểm tra phân tán",cite:"Điều 16 khoản 5; Điều 17; Điều 18",body:"NHNN, Bộ Công Thương, Bộ Khoa học và Công nghệ, Thanh tra Chính phủ và UBND/Thanh tra tỉnh đều có thẩm quyền với các mảng của kinh doanh vàng. Cơ chế phối hợp ở Điều 18 chỉ dừng ở mức “căn cứ vào yêu cầu thực tế”, chưa có đầu mối, quy chế chia sẻ dữ liệu hay kế hoạch thanh tra chung, nên có nguy cơ chồng chéo hoặc bỏ sót.",rec:"Giao NHNN làm đầu mối điều phối kế hoạch thanh tra liên ngành và dùng chung hệ thống dữ liệu đã quy định ở Điều 16 khoản 4."},

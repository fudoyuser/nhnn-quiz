Điều 8 TT 42/2026. Khoản 2 (phương pháp kiểm kê) giữ nguyên.","am":"Sửa đổi bởi TT 42/2026"},{"ch":"X","ty":"ss","q":"Căn cứ về chức năng, nhiệm vụ của NHNN được Thông tư 42/2026 viện dẫn là văn bản nào?","o":["Nghị định 26/2025/NĐ-CP, được sửa đổi bởi Nghị định 198/2026/NĐ-CP","Nghị định 16/2017/NĐ-CP ngày 17/02/2017","Nghị định 40/2012/NĐ-CP ngày 02/5/2012","Nghị định 16/2017/NĐ-CP, được sửa đổi, bổ sung bởi Nghị định 26/2025/NĐ-CP"],"c":"Căn cứ ban hành TT 42/2026 (chú thích 1)","ex":"TT 03/2020 căn cứ NĐ 16/2017; TT 42/2026 căn cứ NĐ 26/2025/NĐ-CP được sửa đổi, bổ sung bởi NĐ 198/2026/NĐ-CP. NĐ 40/2012 là căn cứ về nghiệp vụ phát hành tiền.","am":"Sửa đổi bởi TT 42/2026"},{"ch":"X","ty":"ss","q":"Thay đổi nào sau đây do Thông tư 42/2026 thực hiện?","o":["Chuyển đơn vị chủ trì giám sát tiêu hủy tiền sang Thanh tra NHNN","Tăng số tổ chuyên trách tại mỗi cụm từ 4 lên 5 tổ","Bỏ Cụm tiêu hủy phía Nam, tập trung toàn bộ công tác tiêu hủy tại Cục Phát hành và Kho quỹ ở Hà Nội","Giao Cục trưởng thẩm quyền thành lập Hội đồng tiêu hủy"],"c":"Điều 29; chú thích 25","ex":"TT 42/2026 thay “Vụ Kiểm toán nội bộ” bằng “Thanh tra NHNN”. Số tổ (4), hai cụm tiêu hủy và thẩm quyền của Thống đốc thành lập Hội đồng giữ nguyên.","am":"Sửa đổi bởi TT 42/2026"},{"ch":"X","ty":"ss","q":"Thông tư 42/2026 sửa đổi những khoản nào của Điều 24 (tổng hợp và báo cáo)?","o":["Khoản 1 và khoản 3","Khoản 2 và khoản 3","Chỉ khoản 2","Cả khoản 1, 2 và 3"],"c":"Chú thích 22, 23","ex":"Khoản 1 (báo cáo hằng tháng) và khoản 3 (báo cáo sơ kết, tổng kết) được sửa đổi theo khoản 1, 2 Điều 10 TT 42/2026. Khoản 2 (biên bản cuối năm 5 bản) giữ nguyên.","am":"Sửa đổi bởi TT 42/2026"},{"ch":"II","ty":"nd","q":"Những nhận định nào đúng về Hội đồng tiêu hủy?","o":["(1), (3) và (4)","(1), (2) và (3)","(2), (3) và (4)","(1) và (4)"],"c":"Điều 6 khoản 1","ex":"Hội đồng tiêu hủy có 3 Phó Chủ tịch (thường trực; Phó Vụ trưởng Vụ Tài chính - Kế toán; Chi cục trưởng tại TP. Hồ Chí Minh), không phải 2.","st":["Chủ tịch là Cục trưởng Cục Phát hành và Kho quỹ","Hội đồng có 02 Phó Chủ tịch","Phó Chủ tịch thường trực trực tiếp phụ trách Cụm tiêu hủy phía Bắc","Thống đốc quyết định thành lập Hội đồng hằng năm"]},{"ch":"III","ty":"nd","q":"Có bao nhiêu nhận định đúng về quản lý kho tiền tiêu hủy?","o":["3","2","4","1"],"c":"Điều 13 khoản 2","ex":"Ủy viên Hội đồng tiêu hủy giữ chìa khóa một ổ khóa của lớp cánh ngoài, không phải cánh trong.","st":["Mỗi cụm có 03 thành viên quản lý kho tiền tiêu hủy","Ủy viên Hội đồng tiêu hủy giữ chìa khóa một ổ khóa lớp cánh trong","Nhân viên kế toán kho giữ chìa khóa một ổ khóa lớp cánh ngoài","Thủ kho giữ chìa khóa một ổ khóa lớp cánh trong"]},{"ch":"III","ty":"nd","q":"Những nhận định nào đúng về quy cách đóng gói sau kiểm đếm?","o":["(1), (2) và (4)","(1), (2) và (3)","(2), (3) và (4)","Cả (1), (2), (3) và (4)"],"c":"Điều 16 khoản 4","ex":"Thùng tiền kim loại mệnh giá 200 đồng đóng 100 túi, không phải 75 túi.","st":["Bó tiền giấy gồm 10 thếp cùng loại","Túi tiền kim loại đủ 1.000 miếng","Thùng tiền kim loại mệnh giá 200 đồng đóng 75 túi","Thùng tiền kim loại mệnh giá 5.000 đồng đóng 50 túi"]},{"ch":"III","ty":"nd","q":"Những nhận định nào đúng về an ninh, an toàn khu vực tiêu hủy?","o":["(1) và (3)","(1), (2) và (3)","(3) và (4)","(1), (3) và (4)"],"c":"Điều 18 khoản 1, 2, 3","ex":"Không được mang thiết bị liên lạc vào nơi làm việc (kể cả khi tắt nguồn). Trách nhiệm an toàn tài sản trong phạm vi được giao thuộc nhân viên Tổ 1, Tổ 2, Tổ 3, không phải Tổ 4.","st":["Giờ nghỉ trưa, công chức, người lao động không được ở lại nơi làm việc","Được mang điện thoại vào phòng kiểm đếm nếu đã tắt nguồn","Trong giờ làm việc, vào ra khu vực phải ký xác nhận vào sổ theo dõi","Nhân viên Tổ 4 chịu trách nhiệm an toàn tài sản trong phòng kiểm đếm"]},{"ch":"IV","ty":"nd","q":"Trong các nhận định về kiểm kê và báo cáo, nhận định nào SAI?","o":["(3)","(1)","(2)","(4)"],"c":"Điều 21; Điều 24","ex":"Biên bản kết quả tiêu hủy hoàn toàn cuối năm được lập thành 05 bản, không p khôi phục để sử dụng lại như tiền","Thống đốc quyết định tỷ lệ kiểm đếm từng loại tiền"],"am":"Sửa đổi bởi TT 42/2026"},{"ch":"I","ty":"nd","q":"Có bao nhiêu nhận định đúng về phương pháp tiêu hủy tiền?","o":["4","3","2","1"],"c":"Điều 5; Điều 17 khoản 5","ex":"Cả bốn nhận định đều đúng.","st":["Tiền giấy cotton và polymer đều được tiêu hủy bằng hệ thống máy cắt hủy chuyên dùng","Tiền kim loại có thể được tiêu hủy bằng phương pháp nấu chảy","Tiền kim loại có thể được tiêu hủy bằng máy hủy tiền kim loại chuyên dùng","Cục trưởng Cục Phát hành và Kho quỹ hướng dẫn quy trình tiêu hủy bằng máy hủy"]},{"ch":"III","ty":"nd","q":"Những nhận định nào đúng về thẩm quyền liên quan đến kho tiền tiêu hủy?","o":["(2), (3) và (4)","(1), (2) và (3)","(1) và (4)","(1), (3) và (4)"],"c":"Điều 13 khoản 2 điểm b; Điều 28 khoản 2","ex":"Thành viên quản lý kho do Thống đốc xem xét, quyết định, không phải Chủ tịch Hội đồng tiêu hủy. Cục Phát hành và Kho quỹ trình Thống đốc.","st":["Chủ tịch Hội đồng tiêu hủy quyết định thành viên quản lý kho tiền tiêu hủy","Cục Phát hành và Kho quỹ trình Thống đốc quyết định thành lập Hội đồng tiêu hủy","Cục Phát hành và Kho quỹ trình Thống đốc cử thành viên quản lý kho","Thống đốc xem xét, quyết định thành viên quản lý kho tiền tiêu hủy"]},{"ch":"IV","ty":"so","q":"Phân biệt số bản của hai loại biên bản:","o":["Biên bản kiểm kê: 03 bản; biên bản kết quả tiêu hủy hoàn toàn cuối năm: 05 bản","Biên bản kiểm kê: 05 bản; biên bản kết quả tiêu hủy hoàn toàn cuối năm: 03 bản","Biên bản kiểm kê: 02 bản; biên bản kết quả tiêu hủy hoàn toàn cuối năm: 04 bản","Cả hai loại biên bản đều lập thành 03 bản"],"c":"Điều 21 khoản 3; Điều 24 khoản 2","ex":"Biên bản kiểm kê: 03 bản (Hội đồng tiêu hủy 02, Hội đồng giám sát 01). Biên bản cuối năm: 05 bản (Vụ Tài chính - Kế toán 01, Cục 02, Hội đồng giám sát 01, lưu cụm 01).","am":"Sửa đổi bởi TT 42/2026"},{"ch":"III","ty":"so","q":"Các mức 50 – 75 – 100 túi/thùng lần lượt tương ứng với mệnh giá tiền kim loại nào?","o":["5.000 đồng – 2.000/1.000/500 đồng – 200 đồng","200 đồng – 2.000/1.000/500 đồng – 5.000 đồng","5.000 đồng – 200 đồng – 2.000/1.000/500 đồng","2.000/1.000/500 đồng – 5.000 đồng – 200 đồng"],"c":"Điều 16 khoản 4 điểm b","ex":"Mệnh giá càng lớn (miếng càng nặng) thì thùng chứa càng ít túi: 5.000 đồng: 50 túi; 2.000, 1.000, 500 đồng: 75 túi; 200 đồng: 100 túi."},{"ch":"III","ty":"so","q":"Mốc “15 ngày làm việc” tại Điều 13 dùng để làm gì?","o":["Phân định thẩm quyền cử người thay thế thành viên quản lý kho nghỉ làm việc","Thời hạn tối đa lưu kho tiền trước khi cắt hủy","Thời hạn gửi biên bản thừa, thiếu cho NHNN chi nhánh Khu vực, Sở Giao dịch NHNN kể từ ngày kiểm đếm","Thời hạn Hội đồng giám sát xác nhận biên bản kiểm kê"],"c":"Điều 13 khoản 3","ex":"Nghỉ ít hơn 15 ngày làm việc: Chủ tịch Hội đồng tiêu hủy (Cụm Bắc) hoặc Phó Chủ tịch phụ trách Cụm Nam quyết định người thay thế. Từ 15 ngày làm việc trở lên: Thống đốc quyết định."},{"ch":"II","ty":"so","q":"Con số nào KHÁC với các con số còn lại?","o":["Số tổ chuyên trách tại mỗi cụm tiêu hủy","Số Phó Chủ tịch Hội đồng tiêu hủy","Số thành viên quản lý kho tiền tiêu hủy tại mỗi cụm","Số ủy viên kiêm thư ký trong Hội đồng tiêu hủy"],"c":"Điều 6; Điều 13 khoản 2","ex":"Mỗi cụm có 04 tổ chuyên trách. Ba con số còn lại đều bằng 3: 3 Phó Chủ tịch, 3 thành viên quản lý kho, 3 ủy viên kiêm thư ký."},{"ch":"III","ty":"so","q":"Mô tả nào đúng về quy cách bó (túi) tiền giấy sau kiểm đếm?","o":["Bó 10 thếp, buộc 2 vòng ngang 1 vòng dọc; tiền biến dạng đóng túi vải 1.000 tờ","Bó 10 thếp, buộc 1 vòng ngang 2 vòng dọc; tiền biến dạng đóng túi vải 500 tờ","Bó 5 thếp, buộc 2 vòng ngang 1 vòng dọc; tiền biến dạng đóng túi vải 1.000 tờ","Bó 10 thếp, buộc 2 vòng ngang 2 vòng dọc; tiền biến dạng đóng túi nilon 1.000 tờ"],"c":"Điều 16 khoản 4 điểm a","ex":"Xếp 10 thếp cùng loại thành 01 bó, buộc chặt 02 vòng ngang, 01 vòng dọc. Tiền giấy biến dạng đóng vào 01 túi vải đủ 1.000 tờ."},{"ch":"X","ty":"so","q":"Ngày 15/5/2020 gắn với sự kiện nào?","o":["Thông tư 03/2020/TT-NHNN có hiệu lực","Thông tư 03/2020/TT-NHNN được ký ban hành","Thông tư 27/2012/TT-NHNN có hiệu lực","Thông tư 42/2026/TT-NHNN được ký ban hành"],"c":"Phần mở đầu VBHN; Điều 32","ex":"TT 03/2020 ký ngày 31/3/2020, có hiệu lực từ 15/5/2020. TT 42/2026 ký ngày 26/8/2026, hiệu lực từ 10/10/2026."},{"ch":"IV","ty":"so","q":"Biên bản kết quả tiêu hủy hoàn toàn cuối năm (05 bản) được phân phối như thế nào?","o":["Vụ Tài chính - Kế toán 01; Cục Phát hành và Kho quỹ 02; Hội đồng giám sát 01; lưu cụm 01","Vụ Tài chính - Kế toán 02; Cục Phát hành và Kho quỹ 01; Hội đồng giám sát 01; lưu cụm 01","Cục Phát hành và Kho quỹ 02; Hội đồng giám sát 02; lưu cụm 01","Thống đốc 01; Cục Phát hành và Kho quỹ 02; Hội đồng giám sát 01; lưu cụm 01"],"c":"Điều 24 khoản 2","ex":"Biên bản được lập thành 05 bản: 01 bản gửi Vụ Tài chính - Kế toán, 02 bản gửi Cục Phát hành và Kho quỹ, 01 bản gửi Hội đồng giám sát, 01 bản lưu tại cụm tiêu hủy."},{"ch":"II","ty":"nho","q":"Nhiệm vụ nào sau đây thuộc Hội đồng tiêu hủy theo Điều 7?","o":["Tổ chức tổng kết, đánh giá và đề xuất khen thưởng, xử lý vi phạm trong tiêu hủy tiền","Phê duyệt kế hoạch tiêu hủy tiền hằng năm của NHNN","Chủ trì giám sát tiêu hủy tiền tại hai cụm tiêu hủy","Quyết định thành viên tham gia quản lý kho tiền tiêu hủy và cử người thay thế khi thành viên nghỉ làm việc"],"c":"Điều 7","ex":"Hội đồng tiêu hủy: chỉ đạo, tổ chức tiêu hủy dưới sự giám sát của Hội đồng giám sát; xử lý kịp thời tồn tại, thiếu sót; tổ chức tổng kết, đánh giá, đề xuất khen thưởng, xử lý vi phạm; bảo quản hồ sơ, tài liệu."},{"ch":"II","ty":"nho","q":"Hội đồng tiêu hủy chỉ đạo và tổ chức tiêu hủy tiền dưới sự giám sát của ai?","o":["Hội đồng giám sát tiêu hủy tiền","Vụ Tài chính - Kế toán và Thanh tra NHNN","Thống đốc NHNN trực tiếp","Cơ quan công an"],"c":"Điều 7 khoản 1","ex":"Hội đồng tiêu hủy chỉ đạo và tổ chức thực hiện công tác tiêu hủy tiền tại các cụm tiêu hủy … dưới sự giám sát của Hội đồng giám sát, đảm bảo an toàn tuyệt đối."},{"ch":"II","ty":"nho","q":"Tổ trưởng tổ chuyên trách chấp hành sự phân công của ai?","o":["Phó Chủ tịch phụ trách cụm tiêu hủy","Chủ tịch Hội đồng giám sát","Chủ tịch Hội đồng giám sát tiêu hủy tiền","Ủy viên kiêm thư ký Hội đồng"],"c":"Điều 11 khoản 1","ex":"Tổ trưởng chấp hành sự phân công của Phó Chủ tịch phụ trách cụm tiêu hủy và chịu trách nhiệm trước Hội đồng tiêu hủy về nhiệm vụ được giao."},{"ch":"II","ty":"nho","q":"Công chức, người lao động tham gia tiêu hủy tiền được quản lý theo những quy định nào?","o":["Quy chế phân cấp quản lý công chức, viên chức, người lao động của NHNN và Bộ luật Lao động","Quy chế riêng do Chủ tịch Hội đồng tiêu hủy ban hành cho từng đợt tiêu hủy, có ý kiến của Hội đồng giám sát","Quy định của Hội đồng giám sát về tiêu chuẩn kiểm ngân","Hợp đồng dịch vụ ký với Cục Phát hành và Kho quỹ"],"c":"Điều 12 khoản 1","ex":"Phải đủ tiêu chuẩn chức danh theo quy định và được quản lý theo Quy chế phân cấp quản lý công chức, viên chức và người lao động thuộc NHNN, Bộ luật Lao động và các văn bản liên quan."},{"ch":"III","ty":"nho","q":"Căn cứ chứng từ xuất kho tiền tiêu hủy, Kho tiền Trung ương làm gì?","o":["Lập Biên bản giao nhận tiền và giao tiền tiêu hủy cho từng cụm","Lập lệnh điều chuyển gửi Cục Phát hành và Kho quỹ và Vụ Tài chính - Kế toán","Kiểm đếm tờ (miếng) toàn bộ trước khi giao","Niêm phong lại toàn bộ bao (thùng) tiền tiêu hủy"],"c":"Điều 14 khoản 2","ex":"Căn cứ chứng từ xuất kho tiền tiêu hủy, Kho tiền Trung ương lập Biên bản giao nhận tiền và tiến hành giao tiền tiêu hủy cho từng cụm tiêu hủy."},{"ch":"IV","ty":"nho","q":"Thủ kho tiền tiêu hủy phải mở những sổ sách nào theo Điều 23?","o":["Sổ tổng hợp, sổ chi tiết theo dõi nhập, xuất các loại tiền và thẻ kho từng loại tiền","Chỉ sổ quỹ tổng hợp theo dõi giá trị tồn kho cuối ngày","Sổ theo dõi tiền thừa, thiếu, sổ theo dõi tạm ứng của Tổ 2 và sổ theo dõi tiền giả phát hiện qua kiểm đếm","Sổ theo dõi phế liệu và sổ kế toán thu, chi tiêu hủy"],"c":"Điều 23 khoản 2","ex":"Thủ kho tiền tiêu hủy mở sổ tổng hợp và sổ chi tiết theo dõi nhập, xuất các loại tiền; mở thẻ kho theo dõi từng loại tiền bảo quản trong kho."},{"ch":"V","ty":"nho","q":"Khi làm việc trong khu vực tiêu hủy, công chức, người lao động phải thực hiện nội quy, quy chế do ai quy định?","o":["Chủ tịch Hội đồng tiêu hủy","Chủ tịch Hội đồng giám sát","Thống đốc NHNN","Tổ trưởng tổ chuyên trách"],"c":"Điều 25 khoản 1; Điều 8 khoản 2","ex":"Công chức, người lao động có trách nhiệm thực hiện đúng nội quy, quy chế làm việc do Chủ tịch Hội đồng tiêu hủy quy định và các quy định tại Thông tư."},{"ch":"V","ty":"nho","q":"Tập thể, cá nhân có thành tích xuất sắc trong công tác tiêu hủy tiền được khen thưởng theo quy định nào?","o":["Quy định hiện hành của NHNN về công tác thi đua, khen thưởng","Mức thưởng tính theo tỷ lệ giá trị tiền đã tiêu hủy","Quyết định riêng của Chủ tịch Hội đồng giám sát","Quy chế khen thưởng do Hội đồng tiêu hủy ban hành cho mỗi đợt tiêu hủy tiền"],"c":"Điều 27 khoản 1","ex":"Tập thể, cá nhân có thành tích xuất sắc trong công tác tiêu hủy tiền được khen thưởng theo quy định hiện hành của NHNN về công tác thi đua, khen thưởng."},{"ch":"V","ty":"nho","q":"Ai chịu trách nhiệm tổ chức thực hiện Thông tư về tiêu hủy tiền?","o":["Thủ trưởng các đơn vị thuộc NHNN","Chủ tịch Hội đồng tiêu hủy","Chánh Thanh tra NHNN và Chủ tịch Hội đồng giám sát","Giám đốc NHNN chi nhánh Khu vực"],"c":"Điều 33","ex":"Thủ trưởng các đơn vị thuộc Ngân hàng Nhà nước Việt Nam chịu trách nhiệm tổ chức thực hiện Thông tư này.","am":"Sửa đổi bởi TT 42/2026"},{"ch":"III","ty":"nho","q":"Theo Điều 15 khoản 1 (đã sửa đổi), trường hợp Tổ trưởng kiêm Thủ kho tiền tiêu hủy thì thực hiện như thế nào?","o":["Thực hiện nhiệm vụ như Thủ kho","Phải cử người khác làm Thủ kho","Phải được Thống đốc chấp thuận bằng văn bản","Chỉ thực hiện nhiệm vụ của Tổ trưởng"],"c":"Điều 15 khoản 1","ex":"Trường hợp Tổ trưởng kiêm Thủ kho tiền tiêu hủy thì thực hiện nhiệm vụ như Thủ kho.","am":"Sửa đổi bởi TT 42/2026"},{"ch":"III","ty":"order","k":"order","q":"Sắp xếp các bước từ khi có kế hoạch đến khi tiền được cắt hủy.","items":["Thống đốc phê duyệt kế hoạch tiêu hủy tiền","Cục Phát hành và Kho quỹ lập lệnh điều chuyển","Vụ Tài chính - Kế toán (Cụm Bắc) lập phiếu xuất kho","Kho tiền Trung ương lập biên bản giao nhận, giao tiền cho cụm","Thủ kho tiền tiêu hủy nhận nguyên niêm phong, nhập kho tiền tiêu hủy","Lấy ngẫu nhiên theo tỷ lệ, Tổ 1 giao Tổ 2 kiểm đếm tờ (miếng)","Tổ 3 cắt hủy và thu hồi phế liệu"],"c":"Điều 3; Điều 14; Điều 15; Điều 16; Điều 17","ex":"Kế hoạch được duyệt → lệnh điều chuyển → phiếu xuất kho → Kho tiền Trung ương giao → nhập kho tiền tiêu hủy → kiểm đếm mẫu theo tỷ lệ → cắt hủy.","am":"Sửa đổi bởi TT 42/2026"},{"ch":"III","ty":"order","k":"order","q":"Sắp xếp các bước kiểm ngân thực hiện với một bó tiền được giao kiểm đếm.","items":["Nhận đủ số bó (túi) được giao và ký nhận trên sổ giao nhận nội bộ","Kiểm đếm xác định số tờ, phát hiện thừa thiếu, lẫn loại, tiền giả","Hủy giấy niêm phong cũ của bó (túi) đủ số, đúng loại","Đóng bó (túi) và dán niêm phong mới ghi đủ các yếu tố","Cuối ngày giao lại Tổ trưởng Tổ 2 và ký nhận trên sổ giao nhận"],"c":"Điều 16 khoản 3, 4, 8","ex":"Kiểm ngân nhận đủ số bó và ký nhận → kiểm đếm → bó đủ, đúng thì hủy niêm phong cũ → đóng bó, niêm phong mới → cuối ngày giao lại Tổ trưởng Tổ 2.","am":"Sửa đổi bởi TT 42/2026"},{"ch":"IV","ty":"order","k":"order","q":"Sắp xếp các bước tổng hợp, báo cáo kết quả tiêu hủy tiền trong năm.","items":["Hằng tháng, cụm tiêu hủy báo cáo Chủ tịch Hội đồng tiêu hủy và gửi Hội đồng giám sát","Kết thúc năm, cụm lập biên bản kết quả tiêu hủy hoàn toàn có xác nhận của Hội đồng giám sát","Hội đồng tiêu hủy chủ trì cùng Hội đồng giám sát báo cáo tổng kết trình Thống đốc"],"c":"Điều 24","ex":"Báo cáo hằng tháng → biên bản kết quả tiêu hủy hoàn toàn cuối năm → báo cáo sơ kết, tổng kết trình Thống đốc.","am":"Sửa đổi bởi TT 42/2026"},{"ch":"II","ty":"match","k":"match","q":"Nối mỗi tổ chuyên trách với nhiệm vụ chính của tổ.","pairs":[["Tổ 1","Giao nhận và bảo quản tiền trong kho tiền tiêu hủy"],["Tổ 2","Kiểm đếm tờ (miếng), xử lý thừa, thiếu, lẫn loại, tiền giả"],["Tổ 3","Cắt hủy tiền bằng thiết bị chuyên dùng, thu hồi phế liệu"],["Tổ 4","Hành chính, kế toán, thống kê, theo dõi xuất nhập phế liệu"]],"c":"Điều 10","ex":"Tổ 1 giao nhận, bảo quản; Tổ 2 kiểm đếm; Tổ 3 cắt hủy; Tổ 4 tổng hợp."},{"ch":"III","ty":"match","k":"match","q":"Nối mỗi thành viên quản lý kho với chìa khóa và trách nhiệm đặc trưng.","pairs":[["Ủy viên Hội đồng tiêu hủy","Một ổ khóa cánh ngoài; chịu trách nhiệm tổ chức quản lý, an toàn kho"],["Nhân viên kế toán kho tiền","Một ổ khóa cánh ngoài; đối chiếu sổ kế toán với sổ quỹ"],["Thủ kho tiền tiêu hủy","Một ổ khóa cánh trong; xuất, nhập tiền theo chứng từ hợp lệ"]],"c":"Điều 13 khoản 2 điểm c","ex":"Ủy viên và kế toán kho mỗi người giữ một ổ khóa lớp cánh ngoài; thủ kho giữ một ổ khóa lớp cánh trong."},{"ch":"V","ty":"match","k":"match","q":"Nối mỗi đơn vị với trách nhiệm trong công tác tiêu hủy tiền.","pairs":[["Cục Phát hành và Kho quỹ","Trình phương án bán phế liệu tiền tiêu hủy"],["Thanh tra NHNN","Chủ trì giám sát tiêu hủy tiền"],["Vụ Tổ chức cán bộ","Đầu mối tuyển dụng lao động hợp đồng, trưng tập công chức"],["Vụ Tài chính - Kế toán","Tổ chức công tác kế toán tiêu hủy tiền"]],"c":"Điều 28–31","ex":"Phân công trách nhiệm theo Chương VI Thông tư.","am":"Sửa đổi bởi TT 42/2026"},{"ch":"III","ty":"match","k":"match","q":"Nối mỗi mệnh giá tiền kim loại với số túi trong một thùng.","pairs":[["5.000 đồng","50 túi"],["1.000 đồng","75 túi"],["200 đồng","100 túi"]],"c":"Điều 16 khoản 4 điểm b","ex":"5.000 đồng: 50 túi; 2.000, 1.000, 500 đồng: 75 túi; 200 đồng: 100 túi."}],"crit":{"sum":"Thông tư thiết kế quy trình tiêu hủy tiền theo nguyên tắc kiểm soát chéo chặt chẽ. Lần sửa đổi 2026 chủ yếu cập nhật tên đơn vị, chuyển chức năng giám sát sang Thanh tra NHNN và điều chỉnh một số bước kiểm đếm, báo cáo. Phần còn bỏ ngỏ nằm ở cân bằng quyền lực trong Hội đồng tiêu hủy, các tiêu chí kỹ thuật và việc ứng dụng công nghệ.","items":[{"t":"plus","title":"Phân tách nhiệm vụ và kiểm soát chéo nhiều lớp","cite":"Điều 10; Điều 13 khoản 2; Điều 16 khoản 7, 8","body":"Bốn tổ chuyên trách độc lập (giao nhận, kiểm đếm, cắt hủy, tổng hợp). Kho tiền ba thành viên, mỗi người giữ một ổ khóa. Mọi lần giao nhận đều lập biên bản, cửa phòng niêm phong có chữ ký của tổ trưởng và công chức giám sát. Không một cá nhân nào kiểm soát trọn vẹn một luồng tiền, giảm đáng kể rủi ro thông đồng."},{"t":"plus","title":"Kiểm đếm theo tỷ lệ dựa trên dữ liệu rủi ro","cite":"Điều 4 khoản 2; Điều 15 khoản 3","body":"Thay vì kiểm đếm toàn bộ, tỷ lệ kiểm đếm từng loại tiền được quyết định căn cứ kết quả thừa, thiếu của năm, và mẫu được lấy ngẫu nhiên. Cách tiếp cận này tiết kiệm nguồn lực và tập trung vào nơi có rủi ro."},{"t":"plus","title":"Giám sát độc lập hơn","cite":"Điều 29; khoản 3 Điều 13 TT 42/2026","body":"Chức năng chủ trì giám sát chuyển từ Vụ Kiểm toán nội bộ sang Thanh tra NHNN, cùng với Hội đồng giám sát tách biệt khỏi Hội đồng tiêu hủy. Bên thực hiện và bên giám sát được tách rõ."},{"t":"issue","title":"Quyền lực tập trung ở một đơn vị","cite":"Điều 3 khoản 1; Điều 4 khoản 2; Điều 6 khoản 1 điểm a; Điều 8; Điều 28 khoản 1","body":"Cục Phát hành và Kho quỹ xây dựng định mức và kế hoạch tiêu hủy. Cục trưởng vừa trình kế hoạch, vừa làm Chủ tịch Hội đồng tiêu hủy, vừa ban hành nội quy, vừa tự quyết định tỷ lệ kiểm đếm, tức mức độ kiểm tra đối với chính hoạt động do mình tổ chức.","rec":"Yêu cầu Hội đồng giám sát có ý kiến trước khi Chủ tịch quyết định tỷ lệ kiểm đếm, hoặc báo cáo Thống đốc tỷ lệ áp dụng kèm căn cứ."},{"t":"gap","title":"Không có sàn tối thiểu cho tỷ lệ kiểm đếm","cite":"Điều 4 khoản 2; Điều 8 khoản 3","body":"Thông tư không quy định tỷ lệ kiểm đếm tối thiểu hay phương pháp xác định tỷ lệ từ kết quả thừa, thiếu. Về lý thuyết, tỷ lệ có thể được đặt rất thấp nếu năm trước ít sai lệch. Khi đó khả năng phát hiện sai sót giảm, trong khi tiền đã cắt hủy thì không thể kiểm tra lại.","rec":"Quy định tỷ lệ sàn cho từng loại tiền và công thức tham chiếu, ví dụ tăng tỷ lệ khi tỷ lệ thừa, thiếu vượt ngưỡng."},{"t":"gap","title":"Dùng chính tiền tiêu hủy làm quỹ tạm ứng bù thiếu","cite":"Điều 16 khoản 6","body":"Tổ 2 được tạm ứng tiền tiêu hủy để bù vào bó thiếu tờ, lẫn loại, tiền giả. Thông tư không quy định hạn mức tạm ứng tối đa và không quy định thời điểm đối chiếu ngoài kiểm kê hằng ngày. Số tạm ứng còn lại chỉ bị tiêu hủy vào cuối đợt, nên có một lượng tiền thật tồn tại ngoài quy trình chính trong thời gian dài.","rec":"Đặt hạn mức tạm ứng theo mệnh giá và yêu cầu đối chiếu số dư tạm ứng trong biên bản cuối ngày."},{"t":"gap","title":"Thiếu tiêu chuẩn kỹ thuật cho phế liệu và yêu cầu môi trường","cite":"Điều 4 khoản 4; Điều 5; Điều 28 khoản 6","body":"Văn bản chỉ yêu cầu phế liệu “không thể khôi phục để sử dụng lại như tiền”, không quy định kích thước mảnh cắt hay phương pháp kiểm tra. Phế liệu được bán theo phương án do Cục trình. Tiền polymer và kim loại có đặc điểm xử lý môi trường riêng nhưng không được đề cập.","rec":"Ban hành tiêu chí kỹ thuật phế liệu (kích thước tối đa, kiểm tra mẫu) và yêu cầu xử lý, tái chế phù hợp quy định bảo vệ môi trường."},{"t":"gap","title":"Nhiều nội dung kỹ thuật giao văn bản hướng dẫn nội bộ","cite":"Điều 17 khoản 5; Điều 18 khoản 4; Điều 21 khoản 2; Điều 28 khoản 4","body":"Quy trình máy hủy, yêu cầu trang thiết bị, phương pháp kiểm kê, sổ sách và báo cáo đều do Cục trưởng hướng dẫn hoặc “theo quy định hiện hành”. Điều này hợp lý về mặt bảo mật (Điều 4 khoản 1), nhưng khiến Thông tư khó được đánh giá độc lập và phụ thuộc vào chất lượng văn bản hướng dẫn."},{"t":"issue","title":"Quy trình chủ yếu thủ công, chưa tính đến công nghệ giám sát","cite":"Điều 16; Điều 18; Điều 23","body":"Toàn bộ quy trình dựa vào sổ sách, biên bản giấy và niêm phong có chữ ký. Điều 18 cấm cá nhân mang thiết bị ghi hình nhưng không quy định hệ thống camera giám sát của đơn vị, máy đếm và phân loại tự động hay sổ kế toán điện tử, là các công cụ có thể tăng mạnh khả năng truy vết.","rec":"Bổ sung yêu cầu camera giám sát liên tục khu vực kiểm đếm, cắt hủy, lưu trữ có thời hạn, và lộ trình số hóa sổ sách."},{"t":"gap","title":"Không có giới hạn thời gian lưu kho trước khi hủy","cite":"Điều 15; Điều 20 khoản 1","body":"Thông tư không quy định thời gian tối đa từ khi nhận tiền từ Kho tiền Trung ương đến khi cắt hủy. Với tiền lẫn loại, tiền giả, Phó Chủ tịch phụ trách cụm tự quyết định “thời điểm tiêu hủy trong năm”. Tiền chờ hủy càng lâu thì rủi ro bảo quản càng cao.","rec":"Quy định thời hạn lưu kho tối đa hoặc yêu cầu báo cáo Hội đồng giám sát số tồn chờ hủy theo tuổi kho."},{"t":"gap","title":"Văn bản hợp nhất không cho thấy nội dung đã bị bãi bỏ","cite":"Điều 16 khoản 8 điểm đ","body":"Điểm đ chỉ ghi “(được bãi bỏ)” mà không nêu nội dung cũ. Người học và người thực thi phải tra lại văn bản gốc mới hiểu được thay đổi."}],"discuss":["Có nên để Chủ tịch Hội đồng tiêu hủy tự quyết định tỷ lệ kiểm đếm, hay quyền này nên thuộc về Hội đồng giám sát hoặc Thống đốc?","Chuyển giám sát từ Vụ Kiểm toán nội bộ sang Thanh tra NHNN thay đổi bản chất giám sát như thế nào (kiểm toán nội bộ hay thanh tra hành chính)?","Công nghệ nào (camera, máy phân loại, sổ điện tử) có thể thay thế một phần quy trình niêm phong, chữ ký mà không làm giảm an toàn?","Phế liệu tiền polymer nên được bán, tái chế hay tiêu hủy hoàn toàn?"]}}];

/* Dạng câu hỏi và mức độ nhận thức */
const TYPE = {nho:"Ghi nhớ",so:"Phân biệt con số",ss:"So sánh sửa đổi",th:"Tình huống",nd:"Nhiều nhận định",order:"Sắp xếp quy trình",match:"Nối cặp",pb:"Phản biện"};
const LEVEL = {nho:"Ghi nhớ",so:"Ghi nhớ",ss:"Ghi nhớ",th:"Vận dụng",nd:"Vận dụng",order:"Vận dụng",match:"Vận dụng",pb:"Phân tích"};
const LEVELS = ["Ghi nhớ","Vận dụng","Phân tích"];
const KIND = {plus:["Điểm hợp lý","k-plus"],gap:["Cần làm rõ","k-gap"],issue:["Bất cập","k-issue"]};

/* ---------- trạng thái ---------- */
const $ = s => document.querySelector(s);
const store = {
  get(k,d){try{const v=localStorage.getItem("qnhnn:"+k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem("qnhnn:"+k,JSON.stringify(v))}catch(e){}}
};
let doc = DOCS[0];
let filter = "all", lvl = "all", tyf = "all";
let view = "quiz";
let kindOff = {};
let S = null;
let tick = null;

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function derange(n){let a;do{a=shuffle([...Array(n).keys()])}while(n>1&&a.every((v,i)=>v===i));return a}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
const L="ABCD";
const kindOf = q => q.k || "mcq";
const tyOf = q => q.ty || "nho";
const fmt = s=>String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");

function renderStats(){
  const h = store.get("hist_"+doc.id,[]);
  const best = h.filter(x=>x.mode==="exam").reduce((m,x)=>Math.max(m,Math.round(x.ok/x.n*100)),0);
  const wrong = store.get("wrong_"+doc.id,[]).length;
  $("#stats").innerHTML = `<div><b>${doc.qs.length}</b>câu hỏi</div><div><b>${h.length}</b>lượt làm</div><div><b>${best?best+"%":"–"}</b>điểm thi cao nhất</div><div><b>${wrong}</b>câu cần ôn</div>`;
}
function renderDocs(){
  $("#docs").innerHTML = DOCS.map(d=>`<button class="doc ${d.id===doc.id?"on":""}" type="button" data-id="${d.id}">
    <div class="no">${d.no}</div><div class="tt">${esc(d.title)}</div>
    <div class="meta"><span>Xác thực ngày ${d.date}</span><span>${esc(d.signer)}</span></div></button>
    <div class="chain" style="margin:10px 0 14px">${d.chain.map(c=>`<div><b>${c[0]}</b><br>${c[1]}</div>`).join("")}</div>`).join("");
}

/* ---------- lọc ---------- */
function inChapter(q){ return filter==="all" || (filter==="am" ? !!q.am : q.ch===filter); }
function inLevel(q){ return lvl==="all" || LEVEL[tyOf(q)]===lvl; }
function inType(q){ return tyf==="all" || tyOf(q)===tyf; }
function pool(){ return doc.qs.map((q,i)=>inChapter(q)&&inLevel(q)&&inType(q)?i:-1).filter(i=>i>=0); }

/* ---------- màn hình văn bản ---------- */
function home(){
  clearInterval(tick); S=null;
  const cr = doc.crit;
  const tabs = `<div class="tabs" role="tablist">
    <button type="button" class="tab ${view==="quiz"?"on":""}" data-v="quiz" role="tab">Trắc nghiệm<i>${doc.qs.length}</i></button>
    ${cr?`<button type="button" class="tab ${view==="crit"?"on":""}" data-v="crit" role="tab">Phản biện<i>${cr.items.length}</i></button>`:""}</div>`;
  if(view==="crit" && cr){ critique(tabs, cr); return; }

  const counts = {}; doc.qs.forEach(q=>counts[q.ch]=(counts[q.ch]||0)+1);
  const amCount = doc.qs.filter(q=>q.am).length;
  const wrong = store.get("wrong_"+doc.id,[]);
  const chips = [["all","Tất cả",doc.qs.length],["am",doc.amChip,amCount],...Object.keys(doc.chapters).map(k=>[k,doc.chapters[k].split(" · ")[0],counts[k]||0])];
  const lc = {}; doc.qs.forEach(q=>{const l=LEVEL[tyOf(q)];lc[l]=(lc[l]||0)+1});
  const tc = {}; doc.qs.forEach(q=>{const t=tyOf(q);tc[t]=(tc[t]||0)+1});
  const lchips = [["all","Mọi mức độ",doc.qs.length],...LEVELS.filter(l=>lc[l]).map(l=>[l,l,lc[l]])];
  const tchips = [["all","Mọi dạng",doc.qs.length],...Object.keys(TYPE).filter(t=>tc[t]).map(t=>[t,TYPE[t],tc[t]])];
  const n = pool().length;
  const chipRow = (arr,cur,attr)=>arr.map(c=>`<button type="button" class="chip ${cur===c[0]?"on":""}" data-${attr}="${c[0]}">${c[1]}<i>${c[2]}</i></button>`).join("");
  $("#desk").innerHTML = `
    ${tabs}
    <h2>${esc(doc.title)}</h2>
    <p class="lead">${doc.no} · ${doc.qs.length} câu hỏi, mỗi câu có trích dẫn điều, khoản. Câu có nhãn vàng là ${doc.amLead}.</p>
    <div class="rows" id="filters">
      <div><label class="fl">Phạm vi</label><div class="chips">${chipRow(chips,filter,"f")}</div></div>
      <div><label class="fl">Mức độ</label><div class="chips">${chipRow(lchips,lvl,"l")}</div></div>
      <div><label class="fl">Dạng câu hỏi</label><div class="chips">${chipRow(tchips,tyf,"t")}</div></div>
    </div>
    <label class="fl">Chế độ · ${n} câu khớp bộ lọc</label>
    <div class="modes">
      <button type="button" class="mode" data-m="practice" ${n?"":"disabled"}><span class="k">Luyện tập</span><b>Xem đáp án ngay</b><span>${n?`Làm ${n} câu theo bộ lọc đã chọn, đọc căn cứ sau mỗi câu.`:"Không có câu nào khớp bộ lọc."}</span></button>
      <button type="button" class="mode" data-m="exam"><span class="k">Thi thử</span><b>20 câu · 15 phút</b><span>Trộn mọi dạng câu về nội dung văn bản (trừ phản biện), chấm điểm khi nộp bài. Đạt từ 80%.</span></button>
      <button type="button" class="mode" data-m="wrong" ${wrong.length?"":"disabled"}><span class="k">Ôn câu sai</span><b>${wrong.length} câu</b><span>${wrong.length?"Những câu bạn trả lời sai gần đây.":"Chưa có câu sai nào được lưu."}</span></button>
    </div>
    <h3 class="sec">Cấu trúc văn bản</h3>
    <div class="toc">${Object.keys(doc.chapters).map(k=>{const [a,b]=doc.chapters[k].split(" · ");return `<div><span class="c">${a}</span><span>${b}</span><span class="n">${counts[k]||0} câu</span></div>`}).join("")}</div>
    <p class="note">Nguồn: Văn bản hợp nhất ${doc.no}, đăng trên Cổng Thông tin điện tử Chính phủ. Văn bản hợp nhất dùng để tra cứu; khi áp dụng, ${doc.src}.</p>`;
  bindTabs();
  $("#filters").onclick = e=>{const b=e.target.closest(".chip");if(!b)return;
    if(b.dataset.f!==undefined) filter=b.dataset.f; if(b.dataset.l!==undefined) lvl=b.dataset.l; if(b.dataset.t!==undefined) tyf=b.dataset.t; home()};
  $("#desk").querySelectorAll(".mode").forEach(b=>b.onclick=()=>start(b.dataset.m));
}
function bindTabs(){ $("#desk").querySelectorAll(".tab").forEach(b=>b.onclick=()=>{view=b.dataset.v;home()}); }

function critique(tabs, cr){
  const cnt={}; cr.items.forEach(x=>cnt[x.t]=(cnt[x.t]||0)+1);
  const shown = cr.items.filter(x=>!kindOff[x.t]);
  const pbN = doc.qs.filter(q=>tyOf(q)==="pb").length;
  $("#desk").innerHTML = `
    ${tabs}
    <h2>Phản biện: ${esc(doc.title)}</h2>
    <p class="lead">${doc.no} · Phân tích điểm hợp lý, điểm cần làm rõ và bất cập, kèm căn cứ điều khoản và hướng hoàn thiện.</p>
    <p class="crit-sum">${esc(cr.sum)}</p>
    ${pbN?`<div class="nav" style="margin:0 0 20px;justify-content:flex-start"><button type="button" class="btn" id="pbgo">Làm quiz phản biện · ${pbN} câu</button></div>`:""}
    <div class="legend">${Object.keys(KIND).map(k=>`<button type="button" class="pill ${KIND[k][1]} ${kindOff[k]?"off":""}" data-k="${k}" aria-pressed="${!kindOff[k]}">${KIND[k][0]} · ${cnt[k]||0}</button>`).join("")}</div>
    <div class="crits">${shown.map(x=>`<article class="crit">
      <span class="kind ${KIND[x.t][1]}">${KIND[x.t][0]}</span>
      <div class="ch"><b>${esc(x.title)}</b><span>${esc(x.cite)}</span></div>
      <p>${esc(x.body)}</p>
      ${x.rec?`<div class="rec"><b>Hướng hoàn thiện</b>${esc(x.rec)}</div>`:""}
    </article>`).join("") || `<p class="lead">Bật lại ít nhất một nhóm ở trên để xem nội dung.</p>`}</div>
    <h3 class="sec" style="margin-top:26px">Câu hỏi thảo luận</h3>
    <ol class="disc">${cr.discuss.map(d=>`<li>${esc(d)}</li>`).join("")}</ol>
    <p class="note">Phần phản biện là phân tích mang tính học thuật, soạn dựa trên nội dung văn bản hợp nhất để phục vụ ôn tập và thảo luận. Đây không phải quan điểm chính thức của Ngân hàng Nhà nước hay cơ quan ban hành.</p>`;
  bindTabs();
  if($("#pbgo")) $("#pbgo").onclick=()=>{view="quiz";filter="all";lvl="all";tyf="pb";start("practice")};
  $("#desk").querySelectorAll(".pill").forEach(b=>b.onclick=()=>{kindOff[b.dataset.k]=!kindOff[b.dataset.k];home()});
}

/* ---------- phiên làm bài ---------- */
function start(mode){
  let ids;
  if(mode==="wrong") ids = shuffle(store.get("wrong_"+doc.id,[]).filter(i=>doc.qs[i]));
  else if(mode==="exam") ids = shuffle(doc.qs.map((q,i)=>tyOf(q)==="pb"?-1:i).filter(i=>i>=0)).slice(0,20);
  else ids = pool();
  if(!ids.length) return;
  S = {mode, ids, i:0, ans:{}, order:{}, st:{}, mo:{}, t0:Date.now(), limit: mode==="exam"?15*60:0, done:false};
  ids.forEach(id=>{const q=doc.qs[id],k=kindOf(q);
    if(k==="mcq") S.order[id]=shuffle([0,1,2,3]);
    else if(k==="order") S.st[id]=derange(q.items.length);
    else if(k==="match"){ S.mo[id]=derange(q.pairs.length); S.st[id]=q.pairs.map(()=>-1); }
  });
  clearInterval(tick);
  if(S.limit){tick=setInterval(()=>{const el=$("#timer");if(!el||!S)return;const left=S.limit-Math.floor((Date.now()-S.t0)/1000);if(left<=0){finish();return}el.textContent=fmt(left);el.classList.toggle("low",left<120)},1000)}
  question();
  if(window.innerWidth<860){ try{ $("#desk").scrollIntoView({block:"start"}); }catch(e){} }
}

/* Chấm câu sắp xếp và nối cặp */
function judge(id){
  const q=doc.qs[id], st=S.st[id];
  if(kindOf(q)==="order") return st.every((v,i)=>v===i);
  return st.every((v,i)=>v===i);
}
function answerText(q,id,mine){
  const k=kindOf(q);
  if(k==="mcq") return mine ? (S.ans[id]===undefined?null:q.o[S.ans[id]]) : q.o[0];
  if(k==="order") return mine ? S.st[id].map(i=>q.items[i]).join(" → ") : q.items.join(" → ");
  return mine ? q.pairs.map((p,i)=>`${p[0]} → ${S.st[id][i]>=0?q.pairs[S.st[id][i]][1]:"(bỏ trống)"}`).join("; ")
              : q.pairs.map(p=>`${p[0]} → ${p[1]}`).join("; ");
}

function question(){
  const id=S.ids[S.i], q=doc.qs[id], k=kindOf(q), picked=S.ans[id];
  const reveal = S.mode!=="exam" && picked!==undefined;
  const label = {practice:"Luyện tập",exam:"Thi thử",wrong:"Ôn câu sai"}[S.mode];
  const answered = Object.keys(S.ans).length;
  const t = tyOf(q);
  let body = "";
  if(k==="mcq"){
    const ord=S.order[id];
    body = `<div class="opts">${ord.map((oi,j)=>{
      let cls=""; if(reveal){ if(oi===0) cls="ok"; else if(oi===picked) cls="bad"; } else if(picked===oi) cls="pick";
      return `<button type="button" class="opt ${cls}" data-o="${oi}" ${reveal?"disabled":""}><span class="l">${L[j]}</span><span>${esc(q.o[oi])}</span></button>`}).join("")}</div>`;
  } else if(k==="order"){
    const st=S.st[id];
    body = `<p class="hint">Dùng nút ↑ ↓ để đưa các bước về đúng thứ tự.</p><ol class="ord">${st.map((it,pos)=>{
      let cls=""; if(reveal) cls = it===pos?"ok":"bad";
      return `<li class="${cls}"><span class="n">${pos+1}</span><span>${esc(q.items[it])}</span>
        <span class="mv"><button type="button" data-up="${pos}" aria-label="Đưa lên" ${reveal||pos===0?"disabled":""}>↑</button><button type="button" data-dn="${pos}" aria-label="Đưa xuống" ${reveal||pos===st.length-1?"disabled":""}>↓</button></span>
        ${reveal&&it!==pos?`<span class="fix">Đúng ở vị trí này: ${esc(q.items[pos])}</span>`:""}</li>`}).join("")}</ol>`;
  } else {
    const st=S.st[id], mo=S.mo[id];
    body = `<p class="hint">Chọn nội dung tương ứng cho từng dòng bên trái.</p><div class="mt">${q.pairs.map((p,i)=>{
      let cls=""; if(reveal) cls = st[i]===i?"ok":"bad";
      return `<div class="row ${cls}"><span class="l">${esc(p[0])}</span>
        <select id="m-${id}-${i}" data-i="${i}" ${reveal?"disabled":""} aria-label="${esc(p[0])}"><option value="-1">Chọn…</option>${mo.map(r=>`<option value="${r}" ${st[i]===r?"selected":""}>${esc(q.pairs[r][1])}</option>`).join("")}</select>
        ${reveal&&st[i]!==i?`<span class="fix">Đáp án đúng: ${esc(p[1])}</span>`:""}</div>`}).join("")}</div>`;
  }
  const canCheck = k!=="mcq" && S.mode!=="exam" && !reveal;
  const ready = k==="match" ? S.st[id].every(v=>v>=0) : true;
  $("#desk").innerHTML = `
    <div class="bar"><span>${label} · Câu ${S.i+1}/${S.ids.length}</span>
      <span>${S.limit?`Còn lại <span class="timer" id="timer">${fmt(Math.max(0,S.limit-Math.floor((Date.now()-S.t0)/1000)))}</span> · `:""}Đã trả lời ${answered}</span></div>
    <div class="prog"><i style="width:${(S.i+1)/S.ids.length*100}%"></i></div>
    <div class="qtag"><span class="tag">${doc.chapters[q.ch].split(" · ")[0]}</span>${t!=="nho"&&t!=="pb"?`<span class="tag ty">${TYPE[t]}</span>`:""}<span class="tag ty">${LEVEL[t]}</span>${q.am?`<span class="tag am">${typeof q.am==="string"?q.am:doc.amTag}</span>`:""}</div>
    ${q.sc?`<div class="case"><b>Tình huống</b>${esc(q.sc)}</div>`:""}
    <p class="q">${esc(q.q)}</p>
    ${q.st?`<ol class="stmts">${q.st.map(s=>`<li><span>${esc(s)}</span></li>`).join("")}</ol>`:""}
    ${body}
    ${reveal?`<div class="basis"><div class="hd ${picked===0?"ok":"bad"}">${picked===0?"Chính xác":(k==="mcq"?"Chưa đúng · Đáp án "+L[S.order[id].indexOf(0)]:"Chưa đúng · Xem phần sửa ở trên")}<span>${esc(q.c)}</span></div><blockquote>${esc(q.ex)}</blockquote></div>`:""}
    <div class="nav">
      <button type="button" class="btn quiet" id="quit">Thoát</button>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        ${canCheck?`<button type="button" class="btn ghost" id="check" ${ready?"":"disabled"}>Kiểm tra</button>`:""}
        <button type="button" class="btn ghost" id="prev" ${S.i===0?"disabled":""}>Câu trước</button>
        ${S.i<S.ids.length-1?`<button type="button" class="btn" id="next">Câu tiếp</button>`:`<button type="button" class="btn" id="end">${S.mode==="exam"?"Nộp bài":"Xem kết quả"}</button>`}
      </div>
    </div>`;
  const touch = ()=>{ if(S.mode==="exam") S.ans[id]="x"; };
  $("#desk").querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    if(S.mode!=="exam" && S.ans[id]!==undefined) return;
    S.ans[id]=+b.dataset.o; question();
  });
  $("#desk").querySelectorAll("[data-up],[data-dn]").forEach(b=>b.onclick=()=>{
    const st=S.st[id]; const p=+(b.dataset.up??b.dataset.dn); const j=b.dataset.up!==undefined?p-1:p+1;
    [st[p],st[j]]=[st[j],st[p]]; touch(); question();
    const f=$(`[data-${b.dataset.up!==undefined?"up":"dn"}="${j}"]`); if(f&&!f.disabled) f.focus();
  });
  $("#desk").querySelectorAll(".mt select").forEach(sel=>sel.onchange=()=>{
    S.st[id][+sel.dataset.i]=+sel.value; touch(); question();
    const f=document.getElementById(sel.id); if(f) f.focus();
  });
  if($("#check")) $("#check").onclick=()=>{ S.ans[id]=judge(id)?0:1; question(); };
  $("#quit").onclick=home;
  $("#prev").onclick=()=>{S.i--;question()};
  if($("#next")) $("#next").onclick=()=>{S.i++;question()};
  if($("#end")) $("#end").onclick=finish;
}

function finish(){
  if(!S||S.done) return; S.done=true; clearInterval(tick);
  // chấm các câu sắp xếp / nối cặp đã thao tác trong chế độ thi
  S.ids.forEach(id=>{ if(S.ans[id]==="x") S.ans[id]=judge(id)?0:1; });
  const n=S.ids.length, ok=S.ids.filter(id=>S.ans[id]===0).length;
  const pct=Math.round(ok/n*100), secs=Math.floor((Date.now()-S.t0)/1000);
  let wrong=new Set(store.get("wrong_"+doc.id,[]));
  S.ids.forEach(id=>{ if(S.ans[id]===0) wrong.delete(id); else if(S.ans[id]!==undefined) wrong.add(id); });
  store.set("wrong_"+doc.id,[...wrong]);
  const h=store.get("hist_"+doc.id,[]); h.push({mode:S.mode,n,ok,at:Date.now()}); store.set("hist_"+doc.id,h.slice(-50));
  renderStats();
  const by={}; S.ids.forEach(id=>{const l=LEVEL[tyOf(doc.qs[id])];by[l]=by[l]||{n:0,ok:0};by[l].n++;if(S.ans[id]===0)by[l].ok++});
  const byc={}; S.ids.forEach(id=>{const c=doc.qs[id].ch;byc[c]=byc[c]||{n:0,ok:0};byc[c].n++;if(S.ans[id]===0)byc[c].ok++});
  const miss=S.ids.filter(id=>S.ans[id]!==0);
  const pass=pct>=80;
  const d=new Date();
  const bars=(o,name)=>Object.keys(o).map(c=>`<div><span>${name(c)}</span><span class="m"><i style="width:${o[c].ok/o[c].n*100}%"></i></span><span class="v">${o[c].ok}/${o[c].n}</span></div>`).join("");
  $("#desk").innerHTML = `
    <div class="seal">
      <div class="sh"><span>Giấy niêm phong · Kết quả kiểm đếm</span><span>${doc.no}</span></div>
      <span class="stamp">${pass?"ĐẠT":"CHƯA ĐẠT"}</span>
      <dl>
        <div><dt>Ngày kiểm đếm</dt><dd>${String(d.getDate()).padStart(2,"0")}/${String(d.getMonth()+1).padStart(2,"0")}/${d.getFullYear()}</dd></div>
        <div><dt>Số câu (tờ)</dt><dd>${n}</dd></div>
        <div><dt>Đúng</dt><dd>${ok}</dd></div>
        <div><dt>Tỷ lệ</dt><dd>${pct}%</dd></div>
        <div><dt>Thời gian</dt><dd>${fmt(secs)}</dd></div>
      </dl>
      <div class="verdict">${pass?"Bạn nắm vững nội dung trong phạm vi này.":"Ngưỡng đạt là 80%. Xem lại các câu sai bên dưới, chúng đã được lưu vào mục Ôn câu sai."}</div>
    </div>
    <h3 class="sec">Theo mức độ</h3>
    <div class="brk">${bars(by,x=>x)}</div>
    <h3 class="sec">Theo chương</h3>
    <div class="brk">${bars(byc,c=>doc.chapters[c])}</div>
    ${miss.length?`<h3 class="sec">Câu cần xem lại (${miss.length})</h3><div class="rev">${miss.map(id=>{const q=doc.qs[id],mine=S.ans[id]===undefined?null:answerText(q,id,true);return `<article><div class="rq">${q.sc?esc(q.sc)+" ":""}${esc(q.q)}</div>${q.st?`<div class="ra">${q.st.map((s,i)=>`<span>(${i+1}) ${esc(s)}</span>`).join("")}</div>`:""}<div class="ra">${mine===null?`<span class="y">Bỏ trống</span>`:`<span class="y">Bạn chọn: ${esc(mine)}</span>`}<span class="r">Đáp án: ${esc(answerText(q,id,false))}</span></div><div class="rc">${esc(q.c)} · “${esc(q.ex)}”</div></article>`}).join("")}</div>`:""}
    <div class="nav"><button type="button" class="btn quiet" id="back">Về trang văn bản</button><button type="button" class="btn" id="again">Làm lại</button></div>`;
  const m=S.mode;
  $("#back").onclick=home; $("#again").onclick=()=>start(m==="wrong"&&!store.get("wrong_"+doc.id,[]).length?"practice":m);
}

$("#docs").addEventListener("click",e=>{const b=e.target.closest(".doc[data-id]");if(!b)return;doc=DOCS.find(d=>d.id===b.dataset.id);filter="all";lvl="all";tyf="all";kindOff={};renderDocs();renderStats();home()});
renderDocs(); renderStats(); home();
</script>
</body>
</html>
